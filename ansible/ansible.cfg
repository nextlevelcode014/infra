[defaults]
inventory       = inventory/
roles_path      = roles
# remote_user     = ansible
host_key_checking = False
# vault_password_file = ~/.vault_pass.txt

[privilege_escalation]
become      = True
become_method = sudo

[ssh_connection]
# Manda o módulo pela conexão já aberta, sem copiar arquivo, dar chmod,
# rodar e apagar: cada task faz um terço das idas e voltas. Medido em 12
# tasks com become no Pi, na VPS e no pi-lab (pelo salto): 51 s -> 14 s.
# Exige sudo sem requiretty, o padrão do Ubuntu.
pipelining = True

---
# Log dos containers com rotação (o padrão do json-file cresce sem limite e
# lota o disco pequeno da VPS). Vale para container criado depois da mudança:
# os que já existem mantêm o log antigo até serem recriados.
docker_daemon_options:
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: "3"

# Caddy da VPS: domínios públicos + sites privados que moram nela.
caddy_caddyfile_template: Caddyfile.vps.j2
# Token próprio da VPS, separado do do Proxmox (ver roles/caddy/defaults).
caddy_cloudflare_token: "{{ vault_caddy_vps_cloudflare_token }}"
# O forge passa pelo Anubis (instância "forgejo" abaixo) antes do Forgejo.
caddy_vps_forgejo_upstream: 127.0.0.1:8923

# Status page pública do Uptime Kuma em status.nextlevelcode.pro: só a página
# com este slug passa, o resto do Uptime Kuma continua só na tailnet. A página
# é criada à mão na interface (docs/uptime-kuma.md).
caddy_vps_status_page_slug: infra
caddy_vps_status_page_upstream: 127.0.0.1:3001

# Sites só da tailnet, servidos pela VPS em <host>.lab.nextlevelcode.pro. Cada
# um precisa de um registro A específico na Cloudflare apontando para o IP
# Tailscale da VPS (o curinga *.lab aponta para o Caddy do Proxmox; na
# contingência, para o Caddy reserva do Pi: docs/pi-recuperacao.md).
caddy_vps_private_sites:
  - host: uptime
    upstream: 127.0.0.1:3001

# Anubis na frente dos domínios públicos (playbooks/anubis.yml). O target é o
# Forgejo pela tailnet (o forgejo-lxc, ou o Pi com proxmox_fora); o Caddy fala
# com o Anubis.
anubis_instances:
  - name: forgejo
    port: 8923
    target: "http://{{ forgejo_tailscale_ip }}:3000"
    redirect_domains: forge.nextlevelcode.pro
    policy:
      # Buscadores verificados por IP: sem isso o forge some das buscas.
      allow_crawlers: true
      rules:
        # git clone/fetch por HTTPS: o cliente git não roda JavaScript.
        - import: (data)/clients/git.yaml
        # CI do infra: passagem para clientes de máquina. Forgejo autentica o RPC.
        - name: forgejo-ci-rpc
          action: ALLOW
          expression:
            all:
              - host == "forge.nextlevelcode.pro"
              - method == "POST"
              - '"X-Runner-Uuid" in headers && "X-Runner-Token" in headers'
              - >-
                path.matches("^/api/actions/(ping[.]v1[.]PingService/Ping|runner[.]v1[.]RunnerService/(Declare|FetchTask|UpdateTask|UpdateLog|UpdateStepSummary))$")
        - name: forgejo-ci-git-discovery
          action: ALLOW
          expression:
            all:
              - host == "forge.nextlevelcode.pro"
              - method == "GET"
              - path == "/nextlevelcode/infra.git/info/refs"
              - '"service" in query && query["service"] == "git-upload-pack"'
        - name: forgejo-ci-git-fetch
          action: ALLOW
          expression:
            all:
              - host == "forge.nextlevelcode.pro"
              - method == "POST"
              - path == "/nextlevelcode/infra.git/git-upload-pack"
              - '"Content-Type" in headers'
              - headers["Content-Type"] == "application/x-git-upload-pack-request"
        # OCI do CI. Forgejo valida o token e as permissões do pacote.
        - name: forgejo-ci-oci-login
          action: ALLOW
          expression:
            all:
              - host == "forge.nextlevelcode.pro"
              - method == "GET"
              - >-
                path in ["/v2", "/v2/"] || (path == "/v2/token" &&
                (!("scope" in query) || query["scope"] in ["", "*"] ||
                query["scope"].matches("^([*][, ])?repository:nextlevelcode/infra-ci:(pull|push|pull,push|push,pull)([, ][*])?$")))
        # O containerd tenta OAuth por POST. O Forgejo responde 404 e o
        # cliente volta ao GET com Basic. O desafio do Anubis quebra a volta.
        - name: forgejo-ci-oci-oauth-fallback
          action: ALLOW
          expression:
            all:
              - host == "forge.nextlevelcode.pro"
              - method == "POST"
              - path == "/v2/token"
              - '"Content-Type" in headers'
              - headers["Content-Type"].matches("(?i)^application/x-www-form-urlencoded( *; *charset=utf-8)?$")
        - name: forgejo-ci-oci-pull
          action: ALLOW
          expression:
            all:
              - host == "forge.nextlevelcode.pro"
              - method in ["GET", "HEAD"]
              - path.matches("^/v2/nextlevelcode/infra-ci/(manifests/[^/]+|blobs/sha256:[a-f0-9]{64})$")
        - name: forgejo-ci-oci-push
          action: ALLOW
          expression:
            all:
              - host == "forge.nextlevelcode.pro"
              - '"Authorization" in headers'
              - >-
                (method == "POST" && path in ["/v2/nextlevelcode/infra-ci/blobs/uploads", "/v2/nextlevelcode/infra-ci/blobs/uploads/"]) ||
                (method in ["GET", "PATCH", "PUT", "DELETE"] &&
                path.matches("^/v2/nextlevelcode/infra-ci/blobs/uploads/[a-zA-Z0-9_.=-]+$")) ||
                (method == "PUT" && path.matches("^/v2/nextlevelcode/infra-ci/manifests/[^/]+$"))
        # Feeds .rss/.atom dos repositórios, para leitores de feed.
        - import: (data)/apps/gitea-rss-feeds.yaml
        # API com token (o tea usa https://forge.nextlevelcode.pro/api/v1).
        # A API anônima continua desafiada.
        - name: forgejo-api-com-token
          action: ALLOW
          expression:
            all:
              - path.startsWith("/api/")
              - '"Authorization" in headers'
        # Health check para o monitor do Uptime Kuma: a página de desafio
        # responde 200 e deixaria o monitor verde com o Forgejo fora do ar.
        - name: forgejo-healthz
          action: ALLOW
          path_regex: ^/api/healthz$

---
# O que o Uptime Kuma monitora. O role uptime_kuma transforma cada item num
# arquivo para o AutoKuma, que cria ou atualiza o monitor sozinho. Serviço
# novo = uma linha aqui e reaplicar playbooks/uptime-kuma.yml. Item que sai da
# lista tem o monitor apagado.
#
# id: único, vira o nome do arquivo. group: o id de um grupo abaixo. O resto
# são campos do monitor no AutoKuma (url, hostname, port, accepted_statuscodes,
# interval, max_retries...). Ping e porta usam o IP Tailscale: o container
# resolve por DNS público (ver o compose), que não conhece a tailnet.
#
# Os *arr usam /ping: a raiz redireciona para http://<host>/login (eles não
# sabem que estão atrás de HTTPS), na porta 80, que a VPS não alcança.

uptime_kuma_groups:
  - id: pi
    name: Raspberry Pi
  - id: proxmox
    name: Proxmox
  # O id ficou "publico" de quando o grupo tinha esse nome: trocar o id faz o
  # AutoKuma apagar o grupo e criar outro, e o histórico dele se perde.
  - id: publico
    name: VPS
  - id: backups
    name: Backups
  - id: atualizacoes
    name: Atualizações

uptime_kuma_monitors:
  # --- Raspberry Pi ---------------------------------------------------------
  - {id: pi-ping, group: pi, type: ping, name: "Pi (ping)", hostname: "{{ pi_tailscale_ip }}"}
  - id: adguard-dns
    group: pi
    type: dns
    name: AdGuard (DNS)
    hostname: nextlevelcode.pro
    dns_resolve_server: "{{ pi_tailscale_ip }}"
    dns_resolve_type: A
    port: 53
  - {id: adguard, group: pi, type: http, name: AdGuard, url: "https://adguard.lab.nextlevelcode.pro"}
  - {id: jellyfin, group: pi, type: http, name: Jellyfin, url: "https://jellyfin.lab.nextlevelcode.pro"}
  - {id: jellyseerr, group: pi, type: http, name: Jellyseerr, url: "https://jellyseerr.lab.nextlevelcode.pro"}
  - {id: sonarr, group: pi, type: http, name: Sonarr, url: "https://sonarr.lab.nextlevelcode.pro/ping"}
  - {id: radarr, group: pi, type: http, name: Radarr, url: "https://radarr.lab.nextlevelcode.pro/ping"}
  - {id: prowlarr, group: pi, type: http, name: Prowlarr, url: "https://prowlarr.lab.nextlevelcode.pro/ping"}
  - {id: bazarr, group: pi, type: http, name: Bazarr, url: "https://bazarr.lab.nextlevelcode.pro"}
  - {id: qbittorrent, group: pi, type: http, name: qBittorrent, url: "https://qbittorrent.lab.nextlevelcode.pro"}
  - {id: searxng, group: pi, type: http, name: SearXNG, url: "https://searxng.lab.nextlevelcode.pro"}
  - {id: immich, group: pi, type: http, name: Immich, url: "https://immich.lab.nextlevelcode.pro/api/server/ping"}
  - {id: nextcloud, group: pi, type: http, name: Nextcloud, url: "https://nextcloud.lab.nextlevelcode.pro/status.php"}
  - {id: fmd, group: pi, type: http, name: FMD, url: "https://fmd.lab.nextlevelcode.pro"}
  # O Funnel entra pela infraestrutura do Tailscale direto no Pi, sem passar
  # pela VPS; resolve por DNS público, então vê o que a internet vê. Passa
  # pelo Anubis: só o /api/v1/version escapa do desafio (que responde 200 e
  # deixaria o monitor sempre verde).
  - {id: fmd-funnel, group: pi, type: http, name: "FMD (Funnel)", url: "https://fmd.<tailnet>.ts.net/api/v1/version"}

  # --- Proxmox --------------------------------------------------------------
  - {id: proxmox-ping, group: proxmox, type: ping, name: "Proxmox (ping)", hostname: <proxmox_host>}
  - {id: vaultwarden, group: proxmox, type: http, name: Vaultwarden, url: "https://vault.lab.nextlevelcode.pro/alive"}
  - {id: forgejo-ssh, group: proxmox, type: port, name: "Forgejo (SSH)", hostname: "{{ forgejo_tailscale_ip }}", port: 2222}

  # --- VPS: o que a internet vê ---------------------------------------------
  # Passa pelo Anubis: só o /api/healthz escapa do desafio.
  - {id: forge, group: publico, type: http, name: Forgejo, url: "https://forge.nextlevelcode.pro/api/healthz"}

# Backups do borgmatic: {borg_backup_name: rótulo}, um monitor push cada. O
# nome tem que ser o borg_backup_name do role do serviço (dele sai o token).
# O immich entra junto com immich_backup_enabled; antes disso cairia toda noite.
uptime_kuma_backups:
  forgejo: Forgejo
  vaultwarden: Vaultwarden
  arr: Stack Arr
  adguard: AdGuard
  fmd: FMD
  uptime-kuma: Uptime Kuma

# Reboot pendente há mais de 3 dias ou apt-daily-upgrade falhando (role
# reboot_watch): {inventory_hostname: rótulo}. Só host de verdade: em LXC o
# kernel é o do Proxmox e o reboot_watch não roda.
uptime_kuma_reboot_watch:
  pi: Raspberry Pi
  hetzner: VPS

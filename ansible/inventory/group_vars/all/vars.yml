---
# Provisionamento (criar container, CPU, memória, disco, rede, IP, features,
# device passthrough) é do Terraform. Aqui fica só o que rode *dentro* da
# máquina. As vars de host (ansible_host, ansible_user, lxc_vmid) vêm do
# inventário do Terraform.

timezone: America/Fortaleza
ntp_server: pool.ntp.org

# Proxmox
proxmox_host: "<proxmox_host>"
proxmox_node: "proxmox"
proxmox_user: "root@pam"
proxmox_token_id: "ansible"
proxmox_token_secret: "{{ vault_proxmox_token_secret }}"

# Tailscale (artis3n.tailscale.machine)
# --hostname usa o inventory_hostname com sufixo -lxc para distinguir
# containers de bare-metal na tailnet. --ssh expõe o container via tailnet;
# --accept-risk=lose-ssh reconhece que o SSH passa a depender dela.
# Como o acesso principal do Ansible é pela LAN (IP fixo do Terraform),
# este é um caminho alternativo, não o único.
tailscale_authkey: "{{ vault_tailscale_authkey }}"
tailscale_args: "--ssh --accept-risk=lose-ssh --hostname={{ inventory_hostname }}-lxc"

# Forgejo
forgejo_domain: "forge.nextlevelcode.pro"
# SSH do Git permanece privado na tailnet; não passa pelo Caddy HTTP.
forgejo_ssh_domain: "forgejo-lxc"
forgejo_dir: "/opt/forgejo"
forgejo_db_password: "{{ vault_forgejo_db_password }}"

# Caddy (homelab, privado na tailnet)
# Domínio wildcard *.lab.nextlevelcode.pro, acessível via Tailscale split
# DNS. O Caddy público fica na VPS e serve os domínios públicos; este aqui
# existe para os serviços internos do homelab (RPi, etc).
caddy_email: "work@nextlevelcode.pro"
caddy_domain: "lab.nextlevelcode.pro"

# Vaultwarden
# Acessível apenas pelo Caddy interno em *.lab.nextlevelcode.pro. O
# ADMIN_TOKEN é gerado com `docker run --rm vaultwarden/server
# /vaultwarden hash` e vive no vault.
vaultwarden_domain: "vault.lab.nextlevelcode.pro"
vaultwarden_dir: "/opt/vaultwarden"
vaultwarden_admin_token: "{{ vault_vaultwarden_admin_token }}"

# Borg — um repositório para todos os serviços, cada um com seu prefixo
# (forgejo-*, vaultwarden-*, arr-*). Chave e senha são instaladas pelo role
# borg_client; backups e restores leem daqui. Os segredos continuam no vault
# com o nome antigo (vault_forgejo_borg_*), da época em que só o Forgejo usava.
borg_repo: "{{ vault_forgejo_borg_repo }}"
borg_host: "{{ borg_repo | urlsplit('hostname') }}"
borg_password_file: /root/.borg-pass
borg_passcommand: "cat {{ borg_password_file }}"
borg_ssh_key: /root/.ssh/id_ed25519
borg_rsh_options: >-
  -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10
  -o ServerAliveInterval=5 -o ServerAliveCountMax=2
borg_rsh: "ssh -i {{ borg_ssh_key }} {{ borg_rsh_options }}"
borg_backup_compression: "zstd,3"
borg_backup_retention: "--keep-daily=7 --keep-weekly=4 --keep-monthly=3"
# Segundos que cada comando espera pela trava do repositório. O Borg só deixa
# um processo escrever por vez, e o padrão (1 s) fazia o backup que chegasse
# depois falhar com "Failed to create/acquire the lock". Os horários também são
# escalonados (forgejo 02:00, vaultwarden 02:15, arr 02:30, adguard 02:45,
# fmd 02:50, immich 03:30).
borg_lock_wait: 600
# Desligado nas máquinas de teste: um backup delas cairia no repositório de
# produção com o mesmo prefixo e viraria "o mais recente" para o restore.
borg_backup_enabled: true

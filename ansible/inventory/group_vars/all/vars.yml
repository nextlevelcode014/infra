---
# Provisionamento (criar container, CPU, memória, disco, rede, IP, features,
# device passthrough) é do Terraform. Aqui fica só o que rode *dentro* da
# máquina. As vars de host (ansible_host, ansible_user, lxc_vmid) vêm do
# inventário do Terraform.

timezone: America/Fortaleza
ntp_server: pool.ntp.org

# Proxmox
proxmox_host: "<proxmox_host>"
proxmox_node: "proxmox"
proxmox_user: "root@pam"
proxmox_token_id: "ansible"
proxmox_token_secret: "{{ vault_proxmox_token_secret }}"

# Contingência: true enquanto o Proxmox estiver fora e o Pi + a VPS fizerem o
# papel dele (docs/pi-recuperacao.md). Liga, de uma vez, o Forgejo e o
# Vaultwarden do Pi com backup, o *.lab no Caddy da VPS e o Anubis do forge
# apontando para o Pi. Trocar aqui e reaplicar os playbooks na ordem do doc.
proxmox_fora: false

# IPs Tailscale. A VPS não resolve nomes da tailnet, então quem fala com o Pi
# ou com o Forgejo de lá (Caddy, Anubis, Uptime Kuma) usa o IP.
pi_tailscale_ip: "<ts_ip>"
forgejo_tailscale_ip: "{{ pi_tailscale_ip if proxmox_fora else '<ip-tailscale-do-forgejo>' }}"

# Tailscale (artis3n.tailscale.machine)
# --hostname usa o inventory_hostname com sufixo -lxc para distinguir
# containers de bare-metal na tailnet. --ssh expõe o container via tailnet;
# --accept-risk=lose-ssh reconhece que o SSH passa a depender dela.
# Como o acesso principal do Ansible é pela LAN (IP fixo do Terraform),
# este é um caminho alternativo, não o único.
tailscale_authkey: "{{ vault_tailscale_authkey }}"
tailscale_args: "--ssh --accept-risk=lose-ssh --hostname={{ inventory_hostname }}-lxc"

# Forgejo
forgejo_domain: "forge.nextlevelcode.pro"
# SSH do Git permanece privado na tailnet; não passa pelo Caddy HTTP.
forgejo_ssh_domain: "forgejo-lxc"
forgejo_dir: "/opt/forgejo"
forgejo_db_password: "{{ vault_forgejo_db_password }}"

# Caddy (homelab, privado na tailnet)
# Domínio wildcard *.lab.nextlevelcode.pro, acessível via Tailscale split
# DNS. O Caddy público fica na VPS e serve os domínios públicos; este aqui
# existe para os serviços internos do homelab (RPi, etc).
caddy_email: "work@nextlevelcode.pro"
caddy_domain: "lab.nextlevelcode.pro"

# Sites do *.lab que moram no Pi: <host>.lab -> porta publicada no IP
# Tailscale dele. Os dois Caddys leem daqui (o da VPS só com proxmox_fora), e
# cada porta precisa de grant no tailscale/policy.hujson.
caddy_lab_pi_routes:
  - {host: jellyfin, port: 8096}
  - {host: jellyseerr, port: 5055}
  - {host: sonarr, port: 8989}
  - {host: radarr, port: 7878}
  - {host: prowlarr, port: 9696}
  - {host: bazarr, port: 6767}
  - {host: profilarr, port: 6868}
  - {host: qbittorrent, port: 8090}  # publicada pelo gluetun
  - {host: dozzle, port: 8081}
  # Uploads grandes e WebSocket passam pelo reverse_proxy sem ajuste (o
  # Caddy não limita corpo nem corta WebSocket por padrão).
  - {host: immich, port: 2283}
  - {host: adguard, port: 8084}
  # O FMD exige HTTPS (Web Crypto); o Caddy entrega. O acesso público de
  # emergência continua pelo Funnel, em fmd.<tailnet>.ts.net.
  - {host: fmd, port: 8085}
  # Apache do Nextcloud AIO no IP Tailscale do Pi (APACHE_IP_BINDING). Uploads
  # e WebSocket (notify_push, Talk, whiteboard) passam sem ajuste.
  - {host: nextcloud, port: 11000}
  - {host: searxng, port: 8082}  # publicada pelo gluetun

# Vaultwarden
# Acessível apenas pelo Caddy interno em *.lab.nextlevelcode.pro. O
# ADMIN_TOKEN é gerado com `docker run --rm vaultwarden/server
# /vaultwarden hash` e vive no vault.
vaultwarden_domain: "vault.lab.nextlevelcode.pro"
vaultwarden_dir: "/opt/vaultwarden"
vaultwarden_admin_token: "{{ vault_vaultwarden_admin_token }}"

# Borg — um repositório para todos os serviços, cada um com seu prefixo
# (forgejo-*, vaultwarden-*, arr-*). Chave, senha e borgmatic são instalados
# pelo role borg_client; backups (borgmatic) e restores (borg direto) leem
# daqui. Os segredos continuam no vault com o nome antigo
# (vault_forgejo_borg_*), da época em que só o Forgejo usava. docs/backup.md.
borg_repo: "{{ vault_forgejo_borg_repo }}"
borg_host: "{{ borg_repo | urlsplit('hostname') }}"
borg_password_file: /root/.borg-pass
borg_passcommand: "cat {{ borg_password_file }}"
borg_ssh_key: /root/.ssh/id_ed25519
borg_rsh_options: >-
  -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10
  -o ServerAliveInterval=5 -o ServerAliveCountMax=2
borg_rsh: "ssh -i {{ borg_ssh_key }} {{ borg_rsh_options }}"
borg_backup_compression: "zstd,3"
# Por serviço: o prune de cada um só olha os archives do prefixo dele.
borg_backup_retention:
  keep_daily: 7
  keep_weekly: 4
  keep_monthly: 3
# Segundos que cada comando espera pela trava do repositório. O Borg só deixa
# um processo escrever por vez, e o padrão (1 s) fazia o backup que chegasse
# depois falhar com "Failed to create/acquire the lock".
borg_lock_wait: 600
# Um timer do borgmatic por host, que roda os serviços dele em sequência (no
# Pi: adguard, arr, fmd, immich). Entre hosts a trava ainda é disputada, então
# os horários ficam escalonados. Chave = inventory_hostname.
borg_backup_times:
  forgejo: "02:00"
  vaultwarden: "02:15"
  pi: "02:30"
  hetzner: "03:00"
borg_backup_time: "{{ borg_backup_times[inventory_hostname] | default('02:30') }}"
# Cada backup avisa um monitor push no Uptime Kuma (grupo Backups) quando
# termina ou falha. O token sai da senha do Borg + o nome do serviço: o host
# do backup e a VPS já têm a senha, e não sobra segredo novo para o vault.
# borg_backup_name vem de quem usa (tasks_from: backup, role uptime_kuma).
borg_backup_push_token: "{{ ((vault_forgejo_borg_password ~ '-' ~ borg_backup_name) | hash('sha256'))[:32] }}"
borg_backup_push_url: "https://uptime.lab.nextlevelcode.pro/api/push/{{ borg_backup_push_token }}"
# Desligado nas máquinas de teste: um backup delas cairia no repositório de
# produção com o mesmo prefixo e viraria "o mais recente" para o restore.
borg_backup_enabled: true

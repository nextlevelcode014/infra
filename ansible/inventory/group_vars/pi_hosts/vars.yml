---
# Raspberry Pi. O volume LUKS fica em /mnt/secure e guarda tudo que é
# sensível: dados dos serviços (appdata/), .env (env/) e o data-root do
# Docker. Ele não abre sozinho no boot — ver docs/pi.md.
secure_mount_dir: /mnt/secure
appdata_dir: "{{ secure_mount_dir }}/appdata"

# Dono dos arquivos dos containers (usuário ubuntu do Pi).
puid: 1000
pgid: 1000
admin_user: ubuntu

# Caddy reserva do *.lab (playbooks/caddy-pi.yml), com token da Cloudflare
# próprio: dá para revogar sem derrubar o do Proxmox nem o da VPS.
caddy_caddyfile_template: Caddyfile.pi.j2
caddy_cloudflare_token: "{{ vault_caddy_pi_cloudflare_token }}"

# A mesma do Pi e dos composes (TZ=America/Sao_Paulo). Mesmo fuso da
# global, mas trocar só por trocar mexeria em logs e crons do host.
timezone: America/Sao_Paulo

# --- Recuperação: Forgejo e Vaultwarden em standby -------------------------
# A produção está nos LXCs do Proxmox. No Pi os dois ficam prontos (compose,
# imagens, dados no LUKS) e parados; o *-restore.yml com -e restore_on_pi=true
# restaura o archive mais recente da produção e sobe. Ver docs/pi-recuperacao.md.
# Com proxmox_fora o Pi é a produção: o pi-recuperacao.yml sobe os dois e liga
# o backup deles, em vez de derrubar.
forgejo_standby: "{{ not proxmox_fora }}"
vaultwarden_standby: "{{ not proxmox_fora }}"

forgejo_dir: "{{ appdata_dir }}/forgejo"
vaultwarden_dir: "{{ appdata_dir }}/vaultwarden"

# Extração temporária do restore dentro do LUKS, não em /var/tmp (raiz em claro).
forgejo_restore_work_dir: "{{ secure_mount_dir }}/restore/forgejo"
vaultwarden_restore_work_dir: "{{ secure_mount_dir }}/restore/vaultwarden"

# 8080 está ocupada no Pi (Nextcloud AIO e tailscale serve); só no IP Tailscale.
vaultwarden_bind_port: "{{ ts_ip }}:8083"

# Containers que usam a netns do gluetun (network_mode: container:gluetun).
# Quando o gluetun é recriado eles ficam sem rede até serem recriados. Lida
# pelo role gluetun e pelo pi-atualizar.yml.
gluetun_dependents:
  - qbittorrent
  - searxng-core

# O repositório próprio do Immich (borg_immich_repo, ADR 0016) além do
# compartilhado.
borg_known_hosts:
  - host: "{{ borg_host }}"
    key: "{{ vault_forgejo_borg_known_host_key }}"
  - host: "{{ borg_immich_repo | urlsplit('hostname') }}"
    key: "{{ vault_borg_immich_known_host_key }}"

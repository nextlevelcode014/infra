---
# VPS da Hetzner, fora de casa. Base em playbooks/vps.yml (role vps_host),
# serviços em caddy-vps.yml, anubis.yml e uptime-kuma.yml (docs/vps.md).
# Acesso pelo Tailscale SSH com o usuário hetzner (sudo sem senha).
vps:
  hosts:
    hetzner:
      ansible_host: hetzner.<tailnet>.ts.net
      ansible_user: hetzner
      ansible_become: true

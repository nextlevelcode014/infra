---
# Limpa o pi-lab depois de um ensaio: derruba todas as stacks, apaga os dados
# restaurados (que podem ser de produção) e tira as credenciais do Borg.
# Fica a base (Docker, redes, imagens), para o próximo ensaio ser rápido.
#
#   ansible-playbook playbooks/pi-lab-limpar.yml --ask-vault-pass
#
# Só roda em pi_staging, e se recusa a rodar em qualquer host do rpi.
- name: Limpar o pi-lab depois de um ensaio
  hosts: pi_staging
  gather_facts: false
  tasks:
    - name: Recusar qualquer host que não seja só de staging
      ansible.builtin.assert:
        that:
          - "'pi_staging' in group_names"
          - "'rpi' not in group_names"
        fail_msg: "{{ inventory_hostname }} não é só de staging; a limpeza apaga dados."

    # Forgejo e Vaultwarden em standby moram no appdata, não em /opt.
    - name: Achar as stacks em /opt e no appdata
      ansible.builtin.find:
        paths: [/opt, "{{ appdata_dir }}"]
        patterns: [compose.yml, docker-compose.yml]
        depth: 2
        recurse: true
      register: pi_lab_stacks

    - name: Derrubar cada stack, com os volumes dela
      community.docker.docker_compose_v2:
        project_src: "{{ item.path | dirname }}"
        files: ["{{ item.path | basename }}"]
        state: absent
        remove_volumes: true
        remove_orphans: true
      loop: "{{ pi_lab_stacks.files }}"
      loop_control:
        label: "{{ item.path | dirname }}"

    # O que nenhuma stack achada derrubou: uma stack cujo compose já foi
    # apagado (limpeza interrompida no meio) ou container criado à mão.
    - name: Listar os containers que sobraram
      community.docker.docker_host_info:
        containers: true
        containers_all: true
      register: pi_lab_orphans

    - name: Remover os containers que sobraram
      community.docker.docker_container:
        name: "{{ item.Id }}"
        state: absent
        force_kill: true
      loop: "{{ pi_lab_orphans.containers }}"
      loop_control:
        label: "{{ item.Names | first }}"

    - name: Apagar as stacks
      ansible.builtin.file:
        path: "{{ item.path | dirname }}"
        state: absent
      loop: "{{ pi_lab_stacks.files }}"
      loop_control:
        label: "{{ item.path | dirname }}"

    # Tudo o que os serviços e os restores gravaram fica sob appdata_dir (e
    # /mnt/media-stack, que é link para lá). A área de restore também.
    - name: Achar os dados no volume
      ansible.builtin.find:
        paths: ["{{ appdata_dir }}", "{{ secure_mount_dir }}/restore"]
        file_type: any
        hidden: true
      register: pi_lab_data

    - name: Apagar os dados (podem ser de produção)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ pi_lab_data.files }}"
      loop_control:
        label: "{{ item.path }}"

    # all: também os nomeados; sem ele o prune só leva os anônimos.
    - name: Apagar volumes Docker que sobraram
      community.docker.docker_prune:
        volumes: true
        volumes_filters:
          all: true

    - name: Tirar as credenciais do Borg
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ borg_password_file }}"
        - "{{ borg_ssh_key }}"

    - name: Conferir que não sobrou container
      community.docker.docker_host_info:
        containers: true
        containers_all: true
      register: pi_lab_left
      failed_when: pi_lab_left.containers | length > 0

---
- name: Criar LXC no Proxmox
  hosts: proxmox
  gather_facts: true
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_host }}"
      api_user: "{{ proxmox_user }}"
      api_token_id: "{{ proxmox_token_id }}"
      api_token_secret: "{{ proxmox_token_secret }}"
      node: "{{ proxmox_node }}"
      validate_certs: false
  roles:
    - role: geerlingguy.pip
  vars:
    pip_install_packages:
      - name: proxmoxer
        version: ">=2.3"
      - name: requests
  tasks:
    - name: Remover proxmoxer antigo do apt (trixie só tem 2.2, módulo exige >= 2.3)
      ansible.builtin.apt:
        name: python3-proxmoxer
        state: absent

    # - name: Instalar pip
    #   ansible.builtin.apt:
    #     name: python3-pip
    #     state: present
    #     update_cache: true
    #
    # - name: Instalar proxmoxer >= 2.3 via pip
    #   ansible.builtin.pip:
    #     name:
    #       - "proxmoxer>=2.3"
    #       - requests
    #     break_system_packages: true

    - name: Criar container Forgejo
      community.proxmox.proxmox:
        vmid: "{{ lxc_vmid }}"
        hostname: "{{ lxc_hostname }}"
        cmode: shell
        ostemplate: "{{ lxc_template }}"
        cores: "{{ lxc_cores }}"
        memory: "{{ lxc_memory }}"
        disk: "{{ lxc_disk }}"
        password: "{{ lxc_password }}"
        netif:
          net0: "name=eth0,bridge=vmbr0,ip=dhcp"
        nameserver: "{{ lxc_nameserver }}"
        onboot: true
        unprivileged: true
        # features (nesting/keyctl) são aplicadas via pct set abaixo:
        # a API só permite root@pam mexer em flags, token não passa
        state: present

    - name: Verificar config atual do container
      ansible.builtin.command: "pct config {{ lxc_vmid }}"
      register: pct_config
      changed_when: false

    - name: Habilitar nesting + keyctl (Docker em unprivileged; API só permite root@pam)
      ansible.builtin.command: "pct set {{ lxc_vmid }} --features nesting=1,keyctl=1"
      when: "'nesting=1' not in pct_config.stdout or 'keyctl=1' not in pct_config.stdout"

    - name: Liberar /dev/net/tun no container (Tailscale)
      ansible.builtin.command: "pct set {{ lxc_vmid }} --dev0 /dev/net/tun"
      when: "'dev0' not in pct_config.stdout"
      register: tun_passthrough

    - name: Verificar se o container está rodando
      ansible.builtin.command: "pct status {{ lxc_vmid }}"
      register: pct_status
      changed_when: false

    - name: Reiniciar container se o passthrough foi adicionado com ele rodando
      community.proxmox.proxmox:
        vmid: "{{ lxc_vmid }}"
        state: restarted
      when:
        - tun_passthrough is changed
        - "'status: running' in pct_status.stdout"

    - name: Iniciar o container
      community.proxmox.proxmox:
        vmid: "{{ lxc_vmid }}"
        state: started

    - name: Aguardar IP via DHCP no eth0
      ansible.builtin.command: "pct exec {{ lxc_vmid }} -- ip -4 addr show eth0"
      register: eth0_addr
      until: "'inet ' in eth0_addr.stdout"
      retries: 12
      delay: 5
      changed_when: false

    - name: Verificar se curl existe no container
      ansible.builtin.command: "pct exec {{ lxc_vmid }} -- bash -c 'command -v curl'"
      register: curl_check
      failed_when: false
      changed_when: false

    - name: Instalar curl no container
      ansible.builtin.command: >
        pct exec {{ lxc_vmid }} -- bash -c
        "apt-get update -qq && apt-get install -y -qq curl ca-certificates"
      when: curl_check.rc != 0
      register: curl_install
      until: curl_install.rc == 0
      retries: 12
      delay: 5    # apt do 1º boot (unattended-upgrades) segura o lock por um tempo

    - name: Verificar se Tailscale já está instalado
      ansible.builtin.command: "pct exec {{ lxc_vmid }} -- bash -c 'command -v tailscale'"
      register: tailscale_check
      failed_when: false
      changed_when: false

    - name: Instalar Tailscale no container
      ansible.builtin.command: >
        pct exec {{ lxc_vmid }} -- bash -o pipefail -c
        "curl -fsSL https://tailscale.com/install.sh | sh"
      when: tailscale_check.rc != 0
      register: tailscale_install
      until: tailscale_install.rc == 0
      retries: 12
      delay: 5    # script usa apt internamente; pode pegar o lock do 1º boot

    - name: Verificar se Tailscale já está conectado
      ansible.builtin.command: "pct exec {{ lxc_vmid }} -- tailscale status --json"
      register: tailscale_status
      failed_when: false
      changed_when: false
      no_log: true

    - name: Subir Tailscale na tailnet (com Tailscale SSH)
      ansible.builtin.command: >
        pct exec {{ lxc_vmid }} -- tailscale up
        --authkey={{ tailscale_auth_key }}
        --hostname={{ tailscale_hostname }}
        --ssh
        --accept-risk=lose-ssh
      when: >
        tailscale_status.rc != 0 or
        (tailscale_status.stdout | from_json).BackendState != "Running"
      # no_log: true

    - name: Obter IP Tailscale do container
      ansible.builtin.command: "pct exec {{ lxc_vmid }} -- tailscale ip -4"
      register: tailscale_ip
      changed_when: false

    - name: Registrar container no inventário em memória
      ansible.builtin.add_host:
        name: forgejo-lxc
        groups: forgejo
        ansible_host: "{{ tailscale_ip.stdout_lines | first }}"
        ansible_user: root

    - name: Aguardar SSH no IP Tailscale
      ansible.builtin.wait_for:
        host: "{{ tailscale_ip.stdout_lines | first }}"
        port: 22
        timeout: 60
      delegate_to: localhost
      become: false    # check de porta TCP local; o become global pediria sudo sem necessidade

- name: Provisionar Forgejo
  hosts: forgejo
  gather_facts: true
  roles:
    - role: common
    - role: geerlingguy.docker
    - role: forgejo

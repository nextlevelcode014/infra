---
# keyctl só pode ser alterado autenticado como root@pam no Proxmox; um token
# de API recebe 403 mesmo pertencendo ao root. Por isso essa flag fica aqui e
# não no Terraform. Todo o resto do provisionamento é do Terraform.
- name: Aplicar flags do LXC
  hosts: proxmox
  gather_facts: false
  tasks:
    - name: Garantir keyctl no container
      ansible.builtin.include_role:
        name: lxc_flags
      vars:
        lxc_vmid: "{{ hostvars[item].lxc_vmid }}"
      loop: "{{ groups['lxc'] }}"

# pi_hosts fica de fora: o pi-lab é LXC, mas se passa pelo Raspberry Pi e
# recebe a base dele (playbooks/pi.yml) — sem Tailscale, com o Docker do Pi.
# As flags acima ele recebe, porque sem elas o Docker não roda no LXC.
- name: Configurar containers
  hosts: "lxc:!pi_hosts"
  # Os fatos vêm depois da espera: o gather_facts rodaria antes dos
  # pre_tasks e falharia num container que ainda está subindo.
  gather_facts: false
  pre_tasks:
    # Pela conexão do Ansible, com o salto pelo Proxmox (group_vars/lxc): da
    # máquina local não há rota para a bridge dos LXCs.
    - name: Aguardar SSH disponível
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: Coletar os fatos
      ansible.builtin.setup:
  roles:
    - common
    # Máquina de teste não entra na tailnet nem gasta a auth key real.
    - role: artis3n.tailscale.machine
      when: "'staging' not in group_names"
    - geerlingguy.docker

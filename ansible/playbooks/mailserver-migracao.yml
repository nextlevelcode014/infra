---
- name: Migrar os registros de correio do domínio principal
  hosts: vps
  gather_facts: false
  vars_files:
    - ../vars/mailserver.yml
    - ../vars/mailserver-migracao.yml
  tasks:
    - name: Exigir a etapa explícita em uma única VPS
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all == ['hetzner']
          - mailserver_migracao_etapa | default('') in ['autenticacao', 'cortar-mx', 'finalizar-spf', 'voltar-mx']
        fail_msg: Use --limit hetzner e selecione autenticacao, cortar-mx, finalizar-spf ou voltar-mx.
      run_once: true

    - name: Confirmar a ativação versionada antes de concluir o corte
      ansible.builtin.assert:
        that: mailserver_principal_ativo | bool
        fail_msg: Ative o domínio principal pelo fluxo versionado antes de cortar o MX ou finalizar o SPF.
      when: mailserver_migracao_etapa in ['cortar-mx', 'finalizar-spf']

    - name: Executar a etapa de migração
      ansible.builtin.include_role:
        name: mailserver
        tasks_from: migracao

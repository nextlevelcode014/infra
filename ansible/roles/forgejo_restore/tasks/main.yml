---
- name: Exigir confirmação explícita do restore
  ansible.builtin.assert:
    that:
      - forgejo_restore_confirmation == "RESTORE_FORGEJO"
    fail_msg: >-
      Restore bloqueado. Execute o playbook com
      -e forgejo_restore_confirmation=RESTORE_FORGEJO somente depois de
      confirmar que esta instância deve substituir os dados atuais.

# O restore substitui os dados de uma instância que já existe; quem instala
# é o playbooks/forgejo.yml (LXC) ou o pi-recuperacao.yml (Pi, em standby).
- name: Ver se o Forgejo está instalado aqui
  ansible.builtin.stat:
    path: "{{ forgejo_dir }}/docker-compose.yml"
  register: forgejo_restore_compose

- name: Exigir o Forgejo instalado antes de restaurar
  ansible.builtin.assert:
    that: forgejo_restore_compose.stat.exists
    fail_msg: >-
      {{ forgejo_dir }}/docker-compose.yml não existe. Instale antes: no Pi,
      playbooks/pi-recuperacao.yml (--limit rpi ou pi_staging); no LXC,
      playbooks/forgejo.yml.

# Os *_archive_path são relativos (como o borg guarda) para dar para trocar
# com -e por um backup antigo; o borg_restore quer caminho absoluto.
- name: Extrair o backup do Forgejo
  ansible.builtin.include_role:
    name: borg_restore
  vars:
    borg_restore_prefix: forgejo
    borg_restore_source_host: "{{ forgejo_restore_source_host }}"
    borg_restore_work_dir: "{{ forgejo_restore_work_dir }}"
    borg_restore_paths: &forgejo_restore_paths
      - "/{{ forgejo_restore_data_archive_path }}"
      - "/{{ forgejo_restore_dump_archive_path }}"
    borg_restore_required_files: *forgejo_restore_paths

# Um dump vazio apagaria o banco: o psql abaixo roda sobre um volume novo.
- name: Conferir o tamanho do dump
  ansible.builtin.stat:
    path: "{{ forgejo_restore_work_dir }}/extracted/{{ forgejo_restore_dump_archive_path }}"
  register: forgejo_restore_dump

- name: Bloquear restore com dump vazio
  ansible.builtin.assert:
    that: forgejo_restore_dump.stat.size > 0
    fail_msg: "O dump {{ forgejo_restore_dump_archive_path }} do archive {{ borg_restore_archive }} está vazio."

- name: Parar os serviços do Forgejo antes de substituir os dados
  community.docker.docker_compose_v2:
    project_src: "{{ forgejo_dir }}"
    state: absent

- name: Remover dados atuais do Forgejo e do PostgreSQL
  ansible.builtin.file:
    path: "{{ forgejo_dir }}/{{ item }}"
    state: absent
  loop:
    - forgejo
    - postgres

- name: Recriar diretórios de dados
  ansible.builtin.file:
    path: "{{ forgejo_dir }}/{{ item }}"
    state: directory
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_group }}"
    mode: "0750"
  loop:
    - forgejo

- name: Recriar diretório do PostgreSQL
  ansible.builtin.file:
    path: "{{ forgejo_dir }}/postgres"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Restaurar dados do Forgejo
  ansible.builtin.command:
    argv:
      - cp
      - -a
      - "{{ forgejo_restore_work_dir }}/extracted/{{ forgejo_restore_data_archive_path }}/."
      - "{{ forgejo_dir }}/forgejo/"
  changed_when: true

- name: Corrigir ownership dos dados restaurados
  ansible.builtin.file:
    path: "{{ forgejo_dir }}/forgejo"
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_group }}"
    recurse: true

- name: Iniciar somente o PostgreSQL
  community.docker.docker_compose_v2:
    project_src: "{{ forgejo_dir }}"
    services:
      - db
    state: present

- name: Corrigir ownership do volume PostgreSQL
  community.docker.docker_compose_v2_exec:
    project_src: "{{ forgejo_dir }}"
    service: db
    user: root
    tty: false
    argv: [chown, -R, "postgres:postgres", /var/lib/postgresql/data]

- name: Aguardar PostgreSQL ficar saudável
  community.docker.docker_container_info:
    name: forgejo-db
  register: forgejo_restore_db_info
  retries: 30
  delay: 2
  until: (forgejo_restore_db_info.container.State.Health.Status | default('')) == "healthy"

# Shell, não docker_compose_v2_exec: o stdin dele é uma string nos
# argumentos do módulo, e o dump inteiro iria para a memória e para o log.
- name: Carregar dump no PostgreSQL restaurado
  ansible.builtin.shell: >-
    docker compose exec -T db psql -U forgejo -d forgejo
    < {{ forgejo_restore_work_dir }}/extracted/{{ forgejo_restore_dump_archive_path }}
  args:
    chdir: "{{ forgejo_dir }}"
  changed_when: true
  no_log: true

- name: Subir Forgejo e PostgreSQL restaurados
  community.docker.docker_compose_v2:
    project_src: "{{ forgejo_dir }}"
    state: present
    pull: never

- name: Remover arquivos temporários do restore
  ansible.builtin.file:
    path: "{{ forgejo_restore_work_dir }}"
    state: absent

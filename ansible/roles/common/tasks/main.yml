---
- name: Definir timezone
  community.general.timezone:
    name: "{{ timezone }}"

# NTP dentro de container LXC não faz sentido: o relógio é o do kernel do
# host, e sem CAP_SYS_TIME o timesyncd nem conseguiria acertá-lo. Quem
# precisa manter a hora certa é o host Proxmox — os herdeiros acompanham.
# Por isso essas tasks só rodam em máquina "de verdade" (ex.: Raspberry Pi).

# Ubuntu 26.04 troca o timesyncd pelo chrony, já com NTS (NTP autenticado)
# nos servidores da Canonical — melhor que o pool.ntp.org sem autenticação.
# Onde o timesyncd não existe, o relógio fica com o que a distro configurou.
- name: Listar serviços para saber qual cliente NTP existe
  ansible.builtin.service_facts:
  when: ansible_facts.virtualization_type != 'lxc'

- name: Criar diretório de drop-in do systemd-timesyncd
  ansible.builtin.file:
    path: /etc/systemd/timesyncd.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - ansible_facts.virtualization_type != 'lxc'
    - "'systemd-timesyncd.service' in ansible_facts.services"

- name: Configurar NTP server no systemd-timesyncd
  ansible.builtin.copy:
    dest: /etc/systemd/timesyncd.conf.d/10-nextlevelcode.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Gerido pelo Ansible — não editar à mão
      [Time]
      NTP={{ ntp_server }}
  notify: Restart systemd-timesyncd
  when:
    - ansible_facts.virtualization_type != 'lxc'
    - "'systemd-timesyncd.service' in ansible_facts.services"

- name: Garantir systemd-timesyncd ativo
  ansible.builtin.service:
    name: systemd-timesyncd
    state: started
    enabled: true
  when:
    - ansible_facts.virtualization_type != 'lxc'
    - "'systemd-timesyncd.service' in ansible_facts.services"

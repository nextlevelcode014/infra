---
# --- Firewall ----------------------------------------------------------------
# Regras antes do enable: ligar o UFW com política deny sem a regra da
# tailscale0 derrubaria o próprio Ansible.
- name: Instalar o UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Liberar a tailnet
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ vps_host_tailnet_interface }}"

- name: Liberar as portas públicas
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ vps_host_public_tcp_ports }}"

# O roteado fica como a distro deixa: o Docker cuida do próprio FORWARD.
# Porta publicada pelo Docker passa por cima do UFW, por isso os composes da
# VPS publicam só em 127.0.0.1.
- name: Política padrão
  community.general.ufw:
    default: "{{ item.policy }}"
    direction: "{{ item.direction }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Ligar o UFW
  community.general.ufw:
    state: enabled

# --- SSH -----------------------------------------------------------------------
# Ubuntu recente usa ssh.socket: o ssh.service só sobe na primeira conexão, e
# é ele que cria o /run/sshd. Como o acesso é pelo Tailscale SSH, ele pode
# nunca ter subido, e o `sshd -t` recusa validar sem o diretório.
- name: Garantir o /run/sshd para validar a config
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Endurecer o sshd
  ansible.builtin.template:
    src: sshd-nextlevelcode.conf.j2
    dest: /etc/ssh/sshd_config.d/00-nextlevelcode.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reiniciar ssh

# --- Atualizações de segurança ---------------------------------------------------
# Só o que o unattended-upgrades instala por padrão (origem -security). Sem
# reboot automático: o pi-atualizar.yml também só avisa.
- name: Instalar o unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Ligar a atualização automática
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      // Gerido pelo Ansible (roles/vps_host) — não editar à mão.
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

# --- fail2ban ----------------------------------------------------------------------
# Com a 22 fechada no UFW ele não vê nada; fica como fallback se o UFW cair.
# python3-systemd é o que deixa o jail ler o journal.
- name: Instalar o fail2ban
  ansible.builtin.apt:
    name:
      - fail2ban
      - python3-systemd
    state: present

- name: Configurar o jail do sshd
  ansible.builtin.template:
    src: fail2ban-nextlevelcode.local.j2
    dest: /etc/fail2ban/jail.d/00-nextlevelcode.local
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar fail2ban

- name: Garantir o fail2ban ativo
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true

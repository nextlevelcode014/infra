---
vaultwarden_dir: /opt/vaultwarden
# Versão exata (ADR 0005): o Vaultwarden migra o banco ao subir e não volta
# atrás. Subir: notas da versão, trocar aqui e reaplicar (docs/vaultwarden.md).
vaultwarden_image: "vaultwarden/server:1.37.4"
vaultwarden_domain: "vault.lab.nextlevelcode.pro"
vaultwarden_bind_port: 8080
vaultwarden_admin_token: "{{ vault_vaultwarden_admin_token }}"
vaultwarden_signups_allowed: "false"

# SMTP
vaultwarden_smtp_host: "smtp.protonmail.ch"
vaultwarden_smtp_port: "587"
vaultwarden_smtp_security: "starttls"
vaultwarden_smtp_from: "vaultwarden@nextlevelcode.pro"
vaultwarden_smtp_from_name: "NextLevelCode | Vaultwarden"
vaultwarden_smtp_username: "{{ vault_vaultwarden_smtp_username }}"
vaultwarden_smtp_password: "{{ vault_vaultwarden_smtp_password }}"

# Segurança
vaultwarden_signups_verify: "true"
vaultwarden_signups_verify_resend_time: "3600"
vaultwarden_signups_verify_resend_limit: "6"
vaultwarden_password_iterations: "600000"
vaultwarden_password_hints_allowed: "true"
vaultwarden_show_password_hint: "false"
vaultwarden_admin_session_lifetime: "20"

# Email 2FA
vaultwarden_email_2fa_enforce_on_verified_invite: "true"
vaultwarden_email_token_size: "6"
vaultwarden_email_expiration_time: "600"
vaultwarden_email_attempts_limit: "5"

# Proxy
vaultwarden_ip_header: "X-Forwarded-For"
vaultwarden_icon_redirect_code: "302"
vaultwarden_http_request_block_non_global_ips: "true"

# Modo standby (Pi de recuperação): compose e imagens prontos, containers
# parados e sem backup. Quem sobe o serviço é o vaultwarden-restore.yml,
# com o archive mais recente da produção. Ver docs/pi-recuperacao.md.
vaultwarden_standby: false

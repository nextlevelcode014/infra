---
- name: Criar diretório do Vaultwarden
  ansible.builtin.file:
    path: "{{ vaultwarden_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# Standby nunca faz backup: um archive vaultwarden-* do Pi viraria o mais
# recente e o restore pegaria os dados velhos dele.
- name: Configurar o backup do Vaultwarden
  ansible.builtin.include_role:
    name: borg_client
    tasks_from: backup
  vars:
    borg_backup_name: vaultwarden
    borg_backup_active: "{{ not vaultwarden_standby }}"
    borg_backup_sources:
      - "{{ vaultwarden_dir }}/vw-data"
    borg_backup_excludes: ["*.tmp", "*.log", "cache/*"]
    borg_backup_commands:
      - before: action
        when: [create]
        run:
          - docker compose -f {{ vaultwarden_dir }}/docker-compose.yml down
      - after: action
        when: [create]
        run: &vaultwarden_backup_up
          - docker compose -f {{ vaultwarden_dir }}/docker-compose.yml up -d
      - after: error
        run: *vaultwarden_backup_up

- name: Criar diretório de dados
  ansible.builtin.file:
    path: "{{ vaultwarden_dir }}/vw-data"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Remover config.json para usar variáveis de ambiente
  ansible.builtin.file:
    path: "{{ vaultwarden_dir }}/vw-data/config.json"
    state: absent

- name: Renderizar docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ vaultwarden_dir }}/docker-compose.yml"
    mode: "0640"
  register: vaultwarden_compose_render
  notify: Reiniciar Vaultwarden

- name: Subir os serviços
  community.docker.docker_compose_v2:
    project_src: "{{ vaultwarden_dir }}"
    state: present
    pull: always
  when: not vaultwarden_standby

# Standby: imagens baixadas (o restore não depende de registry na hora do
# desastre) e nenhum container rodando. remove_orphans tira também os sidecars
# Tailscale da instância antiga do self-hosted, que usava o mesmo projeto.
- name: Baixar as imagens (standby)
  community.docker.docker_compose_v2_pull:
    project_src: "{{ vaultwarden_dir }}"
  # No --check o compose só "seria" renderizado e o módulo falha sem ele.
  when:
    - vaultwarden_standby
    - not (ansible_check_mode and vaultwarden_compose_render is changed)

- name: Manter os serviços parados (standby)
  community.docker.docker_compose_v2:
    project_src: "{{ vaultwarden_dir }}"
    state: absent
    remove_orphans: true
  # No --check o compose só "seria" renderizado e o módulo falha sem ele.
  when:
    - vaultwarden_standby
    - not (ansible_check_mode and vaultwarden_compose_render is changed)

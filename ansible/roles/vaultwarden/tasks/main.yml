---
- name: Preparar o diretório da stack
  ansible.builtin.include_role:
    name: compose_stack
    tasks_from: dir
  vars:
    compose_stack_dir: "{{ vaultwarden_dir }}"

# Standby nunca faz backup: um archive vaultwarden-* do Pi viraria o mais
# recente e o restore pegaria os dados velhos dele.
- name: Configurar o backup do Vaultwarden
  ansible.builtin.include_role:
    name: borg_client
    tasks_from: backup
  vars:
    borg_backup_name: vaultwarden
    borg_backup_active: "{{ not (vaultwarden_standby | bool) }}"
    borg_backup_sources:
      - "{{ vaultwarden_dir }}/vw-data"
    borg_backup_excludes: ["*.tmp", "*.log", "cache/*"]
    borg_backup_commands:
      - before: action
        when: [create]
        run:
          - docker compose -f {{ vaultwarden_dir }}/compose.yml down
      - after: action
        when: [create]
        run: &vaultwarden_backup_up
          - docker compose -f {{ vaultwarden_dir }}/compose.yml up -d
      - after: error
        run: *vaultwarden_backup_up

- name: Criar diretório de dados
  ansible.builtin.file:
    path: "{{ vaultwarden_dir }}/vw-data"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Remover config.json para usar variáveis de ambiente
  ansible.builtin.file:
    path: "{{ vaultwarden_dir }}/vw-data/config.json"
    state: absent

- name: Subir o Vaultwarden
  ansible.builtin.include_role:
    name: compose_stack
  vars:
    compose_stack_dir: "{{ vaultwarden_dir }}"
    compose_stack_standby: "{{ vaultwarden_standby }}"

---
- name: Criar o diretório da stack
  ansible.builtin.file:
    path: "{{ immich_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  register: immich_stack_dir_result

- name: Copiar o hwaccel.ml.yml
  ansible.builtin.copy:
    src: hwaccel.ml.yml
    dest: "{{ immich_dir }}/hwaccel.ml.yml"
    mode: "0644"

- name: Renderizar o compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ immich_dir }}/compose.yml"
    mode: "0644"

- name: Renderizar o .env
  ansible.builtin.template:
    src: immich.env.j2
    dest: "{{ immich_dir }}/.env"
    mode: "0600"
  no_log: true

- name: Subir o Immich
  community.docker.docker_compose_v2:
    project_src: "{{ immich_dir }}"
    files: [compose.yml]
    state: present
    remove_orphans: true
  # No --check de um host novo o diretório só "seria" criado, e o compose
  # falha com "is not a directory". Pula só nesse caso.
  when: not (ansible_check_mode and immich_stack_dir_result is changed)

# --- Backup -----------------------------------------------------------------
# Repositório no Borg offsite, não o compartilhado; o borg_client já
# instalou Borg, chave, senha e o known_host dele. O config do borgmatic só
# entra com immich_backup_enabled.

# Não para os containers: o banco sai consistente pelo pg_dump, e as fotos são
# arquivos que não mudam depois de gravados. O dump fica dentro do
# UPLOAD_LOCATION, então vai no mesmo archive que as fotos. O test -d vem
# antes do mkdir para não criar o diretório na raiz com o LUKS fechado.
# Sem -t no docker exec: com TTY o dump sai com \r\n e o \r pode cair dentro
# dos dados do COPY. Thumbs e vídeos re-encodados o Immich gera de novo.
- name: Configurar o backup do Immich
  ansible.builtin.include_role:
    name: borg_client
    tasks_from: backup
  vars:
    borg_backup_name: immich
    borg_backup_active: "{{ immich_backup_enabled }}"
    borg_backup_repo: "{{ borg_offsite_repo_immich }}"
    borg_backup_repo_label: offsite
    borg_backup_sources:
      - "{{ immich_upload_location }}"
    borg_backup_excludes:
      - "{{ immich_upload_location }}/thumbs/"
      - "{{ immich_upload_location }}/encoded-video/"
    # Fotos e vídeos já vêm comprimidos: lz4 é o padrão do borg, o mais barato.
    borg_backup_compression: lz4
    borg_backup_commands:
      - before: action
        when: [create]
        run:
          - test -d {{ immich_upload_location }}
          - mkdir -p {{ immich_upload_location }}/database-backup
          - >-
            docker exec immich_postgres pg_dump --clean --if-exists
            --dbname {{ immich_db_database_name }} --username {{ immich_db_username }}
            > {{ immich_upload_location }}/database-backup/immich-database.sql

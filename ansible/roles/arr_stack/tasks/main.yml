---
# LUKS montado, redes e symlinks de /mnt/media-stack vêm das dependências
# (meta/main.yml).
- name: Criar as pastas de configuração
  ansible.builtin.file:
    path: "{{ arr_media_stack_dir }}/config/{{ item }}"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0755"
  loop: "{{ arr_config_dirs }}"

- name: Criar o diretório da stack
  ansible.builtin.file:
    path: "{{ arr_stack_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  register: arr_stack_dir_result

# Substitui o bin/render-config: o decluttarr só aceita segredo inline.
- name: Renderizar a config do decluttarr
  ansible.builtin.template:
    src: decluttarr.config.yaml.j2
    dest: "{{ arr_media_stack_dir }}/config/decluttarr/config.yaml"
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0600"
  no_log: true
  notify: Reiniciar decluttarr

- name: Copiar o compose.yml
  ansible.builtin.copy:
    src: compose.yml
    dest: "{{ arr_stack_dir }}/compose.yml"
    mode: "0644"

- name: Renderizar o .env
  ansible.builtin.template:
    src: media.env.j2
    dest: "{{ arr_stack_dir }}/.env"
    mode: "0600"

- name: Subir a stack
  community.docker.docker_compose_v2:
    project_src: "{{ arr_stack_dir }}"
    files: [compose.yml]
    state: present
  # No --check de um host novo o diretório só "seria" criado, e o compose
  # falha com "is not a directory". Pula só nesse caso.
  when: not (ansible_check_mode and arr_stack_dir_result is changed)

# Parada durante o create para os bancos SQLite dos *arr saírem consistentes.
- name: Configurar o backup da stack Arr
  ansible.builtin.include_role:
    name: borg_client
    tasks_from: backup
  vars:
    borg_backup_name: arr
    borg_backup_sources:
      - "{{ arr_backup_source }}"
    borg_backup_excludes: "{{ arr_backup_excludes + (arr_backup_excluded_app_backups | map('regex_replace', '^', 'pp:' ~ arr_backup_source ~ '/') | list) }}"
    borg_backup_commands:
      - before: action
        when: [create]
        run:
          - docker compose -f {{ arr_stack_dir }}/compose.yml down
      - after: action
        when: [create]
        run: &arr_backup_up
          - docker compose -f {{ arr_stack_dir }}/compose.yml up -d
      - after: error
        run: *arr_backup_up

---
# LUKS montado, redes e symlinks de /mnt/media-stack vêm das dependências
# (meta/main.yml).
- name: Criar as pastas de configuração
  ansible.builtin.file:
    path: "{{ arr_media_stack_dir }}/config/{{ item }}"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0755"
  loop: "{{ arr_config_dirs }}"

- name: Preparar o diretório da stack
  ansible.builtin.include_role:
    name: compose_stack
    tasks_from: dir
  vars:
    compose_stack_dir: "{{ arr_stack_dir }}"

# Renderizada aqui porque o decluttarr só aceita segredo inline, não por env.
- name: Renderizar a config do decluttarr
  ansible.builtin.template:
    src: decluttarr.config.yaml.j2
    dest: "{{ arr_media_stack_dir }}/config/decluttarr/config.yaml"
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0600"
  no_log: true
  notify: Reiniciar decluttarr

- name: Renderizar o .env
  ansible.builtin.template:
    src: media.env.j2
    dest: "{{ arr_stack_dir }}/.env"
    mode: "0600"

- name: Subir a stack
  ansible.builtin.include_role:
    name: compose_stack
  vars:
    compose_stack_dir: "{{ arr_stack_dir }}"

# Parada durante o create para os bancos SQLite dos *arr saírem consistentes.
- name: Configurar o backup da stack Arr
  ansible.builtin.include_role:
    name: borg_client
    tasks_from: backup
  vars:
    borg_backup_name: arr
    borg_backup_sources:
      - "{{ arr_backup_source }}"
    borg_backup_excludes: "{{ arr_backup_excludes + (arr_backup_excluded_app_backups | map('regex_replace', '^', 'pp:' ~ arr_backup_source ~ '/') | list) }}"
    borg_backup_commands:
      - before: action
        when: [create]
        run:
          - docker compose -f {{ arr_stack_dir }}/compose.yml down
      - after: action
        when: [create]
        run: &arr_backup_up
          - docker compose -f {{ arr_stack_dir }}/compose.yml up -d
      - after: error
        run: *arr_backup_up

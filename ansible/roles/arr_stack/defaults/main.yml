---
arr_stack_dir: /opt/arr
app_domain: "{{ caddy_domain }}"

# Usados só pelo decluttarr para falar com os outros apps. As API keys são
# geradas por cada app; a senha é a da WebUI do qBittorrent.
arr_radarr_api_key: "{{ vault_arr_radarr_api_key }}"
arr_sonarr_api_key: "{{ vault_arr_sonarr_api_key }}"
arr_qbit_username: "{{ vault_arr_qbit_username }}"
arr_qbit_password: "{{ vault_arr_qbit_password }}"

# Caminhos que o compose.yml usa. Viram symlinks para o LUKS pelo role
# secure_links (ver meta/main.yml).
arr_media_stack_dir: /mnt/media-stack

arr_config_dirs:
  - qbittorrent
  - jellyfin/config
  - jellyfin/cache
  - jellyseerr/config
  - sonarr
  - radarr
  - prowlarr
  - bazarr
  - profilarr
  - decluttarr
  - dozzle

# Backup Borg com prefixo arr-*. A config inteira, pelo caminho real (não
# pelo symlink): o Borg não segue link no argumento, e é esse caminho que o
# restore espera no archive.
arr_backup_source: "{{ appdata_dir }}{{ arr_media_stack_dir }}/config"
# Backups internos de cada app (zips semanais). Com a stack parada durante o
# backup os bancos já saem consistentes, então os zips só repetem o que o
# Borg guarda — e, compactados, quase não deduplicam (eram 20% do archive).
# Caminhos exatos, não glob: qbittorrent/.../BT_backup (estado dos torrents)
# e jellyfin/.../SQLiteBackups têm "backup" no nome e precisam ficar.
arr_backup_excluded_app_backups:
  - radarr/Backups
  - sonarr/Backups
  - prowlarr/Backups
  - bazarr/backup
  - profilarr/backups
# Logs, caches e o relatório do Sentry: regenerados pelos apps.
arr_backup_excludes:
  - "*.tmp"
  - "sh:**/*.log"
  - "sh:**/log"
  - "sh:**/logs"
  - "sh:**/cache"
  - "sh:**/.cache"
  - "sh:**/Sentry"

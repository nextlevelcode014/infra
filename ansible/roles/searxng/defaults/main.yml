---
searxng_dir: /opt/searxng

# latest (ADR 0010): o SearXNG só publica tag por data, várias por dia, e a
# maioria corrige motor de busca que parou. Sem estado: voltar é trocar a
# imagem pelo digest do log do pi-atualizar.yml.
searxng_image: docker.io/searxng/searxng:latest
searxng_valkey_image: docker.io/valkey/valkey:9-alpine

# Config que o container lê (/etc/searxng), no LUKS.
searxng_config_dir: "{{ appdata_dir }}/searxng/core-config"

# Usuário do container. Ele precisa escrever no diretório de config.
searxng_uid: 977

# Assina os cookies das preferências. Trocar desloga os navegadores.
searxng_secret_key: "{{ vault_searxng_secret_key }}"

---
- name: Criar o diretório da stack
  ansible.builtin.file:
    path: "{{ searxng_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  register: searxng_stack_dir_result

# O container roda como uid 977 e escreve aqui (limiter.toml).
- name: Criar o diretório de config no volume cifrado
  ansible.builtin.file:
    path: "{{ searxng_config_dir }}"
    state: directory
    owner: "{{ searxng_uid }}"
    group: "{{ searxng_uid }}"
    mode: "0755"

- name: Renderizar o settings.yml
  ansible.builtin.template:
    src: settings.yml.j2
    dest: "{{ searxng_config_dir }}/settings.yml"
    owner: "{{ searxng_uid }}"
    group: "{{ searxng_uid }}"
    mode: "0600"
  no_log: true
  notify: Reiniciar SearXNG

- name: Renderizar o compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ searxng_dir }}/compose.yml"
    mode: "0644"

# remove_orphans tira container do projeto que já não está no compose.
- name: Subir o SearXNG
  community.docker.docker_compose_v2:
    project_src: "{{ searxng_dir }}"
    files: [compose.yml]
    state: present
    remove_orphans: true
  # No --check de um host novo o diretório só "seria" criado, e o compose
  # falha com "is not a directory". Pula só nesse caso.
  when: not (ansible_check_mode and searxng_stack_dir_result is changed)

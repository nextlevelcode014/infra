---
- name: Preparar o diretório da stack
  ansible.builtin.include_role:
    name: compose_stack
    tasks_from: dir
  vars:
    compose_stack_dir: "{{ searxng_dir }}"

# O container roda como uid 977 e escreve aqui (limiter.toml).
- name: Criar o diretório de config no volume cifrado
  ansible.builtin.file:
    path: "{{ searxng_config_dir }}"
    state: directory
    owner: "{{ searxng_uid }}"
    group: "{{ searxng_uid }}"
    mode: "0755"

- name: Renderizar o settings.yml
  ansible.builtin.template:
    src: settings.yml.j2
    dest: "{{ searxng_config_dir }}/settings.yml"
    owner: "{{ searxng_uid }}"
    group: "{{ searxng_uid }}"
    mode: "0600"
  no_log: true
  notify: Reiniciar SearXNG

- name: Subir o SearXNG
  ansible.builtin.include_role:
    name: compose_stack
  vars:
    compose_stack_dir: "{{ searxng_dir }}"

---
- name: Preparar o diretório da stack
  ansible.builtin.include_role:
    name: compose_stack
    tasks_from: dir
  vars:
    compose_stack_dir: "{{ adguard_dir }}"

# Sem dono nem modo: no Pi os diretórios já existem no LUKS e o AdGuard
# grava como root dentro deles.
- name: Garantir os diretórios de dados no volume cifrado
  ansible.builtin.file:
    path: "{{ adguard_data_dir }}/{{ item }}"
    state: directory
  loop: [conf, work]

- name: Aplicar o DNS declarado antes de subir a stack
  ansible.builtin.include_role:
    name: adguard_dns
  vars:
    adguard_dns_config_file: "{{ adguard_data_dir }}/conf/AdGuardHome.yaml"
    adguard_dns_stack_dir: "{{ adguard_dir }}"

- name: Subir o AdGuard
  ansible.builtin.include_role:
    name: compose_stack
  vars:
    compose_stack_dir: "{{ adguard_dir }}"

# Sem parar o AdGuard: parar o DNS derruba a rede da casa. A config é um
# arquivo pequeno, e o stats.db, se sair inconsistente, só perde estatística.
# Sem o querylog: é o log de todas as consultas, o maior arquivo (centenas de
# MB) e o mais sensível.
- name: Configurar o backup do AdGuard
  ansible.builtin.include_role:
    name: borg_client
    tasks_from: backup
  vars:
    borg_backup_name: adguard
    borg_backup_sources:
      - "{{ adguard_data_dir }}/conf"
      - "{{ adguard_data_dir }}/work"
    borg_backup_excludes:
      - "{{ adguard_data_dir }}/work/data/querylog.json*"

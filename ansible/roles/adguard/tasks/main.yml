---
- name: Criar o diretório da stack
  ansible.builtin.file:
    path: "{{ adguard_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  register: adguard_stack_dir_result

# Sem dono nem modo: no Pi os diretórios já existem (do link-data) e o
# AdGuard grava como root dentro deles.
- name: Garantir os diretórios de dados no volume cifrado
  ansible.builtin.file:
    path: "{{ adguard_data_dir }}/{{ item }}"
    state: directory
  loop: [conf, work]

- name: Renderizar o compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ adguard_dir }}/compose.yml"
    mode: "0644"

# remove_orphans tira o sidecar tailscale-adguard do compose antigo.
- name: Subir o AdGuard
  community.docker.docker_compose_v2:
    project_src: "{{ adguard_dir }}"
    files: [compose.yml]
    state: present
    remove_orphans: true
  # No --check de um host novo o diretório só "seria" criado, e o compose
  # falha com "is not a directory". Pula só nesse caso.
  when: not (ansible_check_mode and adguard_stack_dir_result is changed)

# Sem parar o AdGuard: parar o DNS derruba a rede da casa. A config é um
# arquivo pequeno, e o stats.db, se sair inconsistente, só perde estatística.
# Sem o querylog: é o log de todas as consultas, o maior arquivo (centenas de
# MB) e o mais sensível.
- name: Configurar o backup do AdGuard
  ansible.builtin.include_role:
    name: borg_client
    tasks_from: backup
  vars:
    borg_backup_name: adguard
    borg_backup_sources:
      - "{{ adguard_data_dir }}/conf"
      - "{{ adguard_data_dir }}/work"
    borg_backup_excludes:
      - "{{ adguard_data_dir }}/work/data/querylog.json*"

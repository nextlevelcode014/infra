---
- name: Criar o diretório da stack
  ansible.builtin.file:
    path: "{{ adguard_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  register: adguard_stack_dir_result

# Sem dono nem modo: no Pi os diretórios já existem (do link-data) e o
# AdGuard grava como root dentro deles.
- name: Garantir os diretórios de dados no volume cifrado
  ansible.builtin.file:
    path: "{{ adguard_data_dir }}/{{ item }}"
    state: directory
  loop: [conf, work]

- name: Renderizar o compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ adguard_dir }}/compose.yml"
    mode: "0644"

# remove_orphans tira o sidecar tailscale-adguard do compose antigo.
- name: Subir o AdGuard
  community.docker.docker_compose_v2:
    project_src: "{{ adguard_dir }}"
    files: [compose.yml]
    state: present
    remove_orphans: true
  # No --check de um host novo o diretório só "seria" criado, e o compose
  # falha com "is not a directory". Pula só nesse caso.
  when: not (ansible_check_mode and adguard_stack_dir_result is changed)

- name: Instalar script de backup do AdGuard
  ansible.builtin.template:
    src: backup-adguard.sh.j2
    dest: "{{ adguard_backup_script }}"
    owner: root
    group: root
    mode: "0750"

- name: Agendar backup do AdGuard
  ansible.builtin.cron:
    name: Backup Borg do AdGuard
    user: root
    state: "{{ 'present' if borg_backup_enabled else 'absent' }}"
    minute: "{{ adguard_backup_schedule.split()[0] }}"
    hour: "{{ adguard_backup_schedule.split()[1] }}"
    day: "{{ adguard_backup_schedule.split()[2] }}"
    month: "{{ adguard_backup_schedule.split()[3] }}"
    weekday: "{{ adguard_backup_schedule.split()[4] }}"
    job: "{{ adguard_backup_script }} >> {{ adguard_backup_log_file }} 2>&1"

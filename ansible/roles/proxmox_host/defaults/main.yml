---
# Base do host do Proxmox (o próprio notebook, não os containers).

# Bateria que fica na tomada 24/7. Long_Life é o "conservation mode" do
# ideapad_laptop: o firmware para de carregar perto de 60%, sem limite
# configurável. O kernel lista as opções em BAT0/charge_types; a escolhida
# aparece entre colchetes.
proxmox_battery: BAT0
proxmox_battery_charge_type: Long_Life

# Rede dos LXCs (ADR 0009): bridge só do Proxmox, sem porta física, com NAT
# para fora pela vmbr0. Faixa e gateway são os mesmos do
# ../terraform/local.tf: mudar aqui é mudar lá.
proxmox_lxc_bridge: vmbr1
proxmox_lxc_address: 10.50.0.1/24
proxmox_lxc_subnet: 10.50.0.0/24
proxmox_lxc_uplink: vmbr0

# ACL do lab (ADR 0017): o Proxmox apaga a ACL de /vms/<id> quando a VM é
# destruída, e o lab@pve só cria VM num VMID que tem a dele. Um timer repõe
# a faixa inteira. Mesmos valores do docs/proxmox.md do repo lab.
proxmox_lab_acl_user: lab@pve
proxmox_lab_acl_role: PVEVMAdmin
proxmox_lab_vmid_first: 900
proxmox_lab_vmid_last: 999
proxmox_lab_acl_script: /usr/local/sbin/lab-acl

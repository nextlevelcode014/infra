- name: Criar diretório do Forgejo
  ansible.builtin.file:
    path: "{{ forgejo_dir }}"
    state: directory
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_group }}"
    mode: "0750"

- name: Criar subdiretórios de dados
  ansible.builtin.file:
    path: "{{ forgejo_dir }}/{{ item }}"
    state: directory
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_group }}"
    mode: "0750"
  loop:
    - forgejo
    - forgejo/conf
    - postgres

- name: Renderizar docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ forgejo_dir }}/docker-compose.yml"
    mode: "0640"

- name: Subir os serviços
  community.docker.docker_compose_v2:
    project_src: "{{ forgejo_dir }}"
    state: present
    pull: always

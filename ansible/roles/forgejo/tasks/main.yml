- name: Criar diretório do Forgejo
  ansible.builtin.file:
    path: "{{ forgejo_dir }}"
    state: directory
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_group }}"
    mode: "0750"

# Standby nunca faz backup: um archive forgejo-* do Pi viraria o mais
# recente e o restore pegaria os dados velhos dele. O dump sai com o banco
# no ar; os dados, com a stack parada. O dump fica no /tmp privado do
# borgmatic.service, mas o caminho no archive é o mesmo que o restore espera.
- name: Configurar o backup do Forgejo
  ansible.builtin.include_role:
    name: borg_client
    tasks_from: backup
  vars:
    borg_backup_name: forgejo
    borg_backup_active: "{{ not forgejo_standby }}"
    borg_backup_sources:
      - "{{ forgejo_dir }}/forgejo"
      - "{{ forgejo_backup_db_dump }}"
    borg_backup_excludes: ["*.tmp", "*.log", "cache/*"]
    borg_backup_commands:
      - before: action
        when: [create]
        run:
          - docker exec forgejo-db pg_dump -U forgejo forgejo > {{ forgejo_backup_db_dump }}
          - docker compose -f {{ forgejo_dir }}/docker-compose.yml down
      - after: action
        when: [create]
        run: &forgejo_backup_up
          - docker compose -f {{ forgejo_dir }}/docker-compose.yml up -d
          - rm -f {{ forgejo_backup_db_dump }}
      - after: error
        run: *forgejo_backup_up

- name: Criar subdiretórios de dados
  ansible.builtin.file:
    path: "{{ forgejo_dir }}/{{ item }}"
    state: directory
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_group }}"
    mode: "0750"
  loop:
    - forgejo
    - forgejo/conf
    - forgejo/signing

# Chave da assinatura dos merges (docs/forgejo.md). O Forgejo procura a
# privada no mesmo caminho da pública, sem o .pub. Ela entra também no backup
# do Borg, junto com o resto de forgejo/.
- name: Instalar a chave de assinatura
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ forgejo_dir }}/forgejo/signing/{{ item.name }}"
    owner: "{{ forgejo_user }}"
    group: "{{ forgejo_group }}"
    mode: "{{ item.mode }}"
  loop:
    - name: key
      content: "{{ forgejo_signing_ssh_private_key | trim }}\n"
      mode: "0600"
    - name: key.pub
      content: "{{ forgejo_signing_ssh_public_key | trim }}\n"
      mode: "0644"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  register: forgejo_signing_key

# É o PGDATA: o Postgres só sobe com ele no próprio usuário (uid 70 na imagem
# alpine) e em 0700, e o entrypoint corrige isso a cada start. Pôr outro dono
# aqui tiraria a escrita do banco em produção até o próximo restart.
- name: Criar diretório do PostgreSQL
  ansible.builtin.file:
    path: "{{ forgejo_dir }}/postgres"
    state: directory
    owner: "70"
    group: root
    mode: "0700"

- name: Renderizar docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ forgejo_dir }}/docker-compose.yml"
    mode: "0640"
  register: forgejo_compose_render

- name: Subir os serviços
  community.docker.docker_compose_v2:
    project_src: "{{ forgejo_dir }}"
    state: present
    pull: always
  when: not forgejo_standby

# O Forgejo lê a chave só ao subir. Se o compose mudou, o passo acima já
# recriou o container; isto cobre a troca só da chave.
- name: Reiniciar o Forgejo para ler a chave nova
  community.docker.docker_compose_v2:
    project_src: "{{ forgejo_dir }}"
    services: [server]
    state: restarted
  when:
    - not forgejo_standby
    - forgejo_signing_key is changed
    - forgejo_compose_render is not changed

# Standby: imagens baixadas (o restore não depende de registry na hora do
# desastre) e nenhum container rodando. remove_orphans tira também container
# do projeto que já não está no compose.
- name: Baixar as imagens (standby)
  community.docker.docker_compose_v2_pull:
    project_src: "{{ forgejo_dir }}"
  # No --check o compose só "seria" renderizado e o módulo falha sem ele.
  when:
    - forgejo_standby
    - not (ansible_check_mode and forgejo_compose_render is changed)

- name: Manter os serviços parados (standby)
  community.docker.docker_compose_v2:
    project_src: "{{ forgejo_dir }}"
    state: absent
    remove_orphans: true
  # No --check o compose só "seria" renderizado e o módulo falha sem ele.
  when:
    - forgejo_standby
    - not (ansible_check_mode and forgejo_compose_render is changed)

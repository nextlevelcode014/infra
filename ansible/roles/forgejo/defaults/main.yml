forgejo_backup_script: "/usr/local/bin/backup_forgejo.sh"
forgejo_backup_log_file: "/var/log/forgejo_backup.log"
forgejo_backup_schedule: "0 2 * * *"

forgejo_image: "codeberg.org/forgejo/forgejo:15-rootless"
forgejo_db_image: "postgres:16-alpine"
forgejo_user: "1000"
forgejo_group: "1000"

# Modo standby (Pi de recuperação): compose e imagens prontos, containers
# parados e sem cron de backup. Quem sobe o serviço é o forgejo-restore.yml,
# com o archive mais recente da produção. Ver docs/pi-recuperacao.md.
forgejo_standby: false

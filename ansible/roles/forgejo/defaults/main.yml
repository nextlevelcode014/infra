# O forgejo_restore lê o dump deste caminho dentro do archive.
forgejo_backup_db_dump: /tmp/forgejo_db_dump.sql

# Versão exata (ADR 0005): o Forgejo migra o banco ao subir e não volta
# atrás. Subir: notas da versão, trocar aqui e reaplicar (docs/forgejo.md).
forgejo_image: "codeberg.org/forgejo/forgejo:17.0.1-rootless"
forgejo_db_image: "postgres:16.15-alpine"
forgejo_user: "1000"
forgejo_group: "1000"

# Identidade que o [repository.signing] exige junto da chave. Nos squash
# merges ela não aparece: o committer continua sendo quem mergeou (visto no
# PR #21), só a assinatura é da instância.
forgejo_signing_name: "Forgejo NextLevelCode"
forgejo_signing_email: "forgejo@nextlevelcode.pro"

# Modo standby (Pi de recuperação): compose e imagens prontos, containers
# parados e sem backup. Quem sobe o serviço é o forgejo-restore.yml,
# com o archive mais recente da produção. Ver docs/pi-recuperacao.md.
forgejo_standby: false

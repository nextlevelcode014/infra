---
- name: Garantir curl e ca-certificates
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
    state: present
    update_cache: true
  register: apt_curl
  until: apt_curl is succeeded
  retries: 12
  delay: 5 # unattended-upgrades do 1º boot segura o lock do apt

- name: Instalar pacote caddy (systemd unit + user caddy)
  ansible.builtin.apt:
    name: "{{ caddy_apt_package }}"
    state: present

# Atualizar o Caddy é decisão, não efeito colateral: a execução normal só
# baixa quando o binário não existe (host novo). Para atualizar, rode com
# -e caddy_upgrade=true. A API de download com plugin só entrega a última
# versão (ignora ?version=), então não dá para fixar uma versão exata sem
# compilar com xcaddy.
- name: Verificar versão do binário custom local
  ansible.builtin.command: /usr/bin/caddy.custom version
  register: caddy_local_version
  changed_when: false
  failed_when: false

- name: Consultar última versão do caddy no GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/caddyserver/caddy/releases/latest
    return_content: true
    headers:
      Accept: application/vnd.github+json
  register: caddy_release
  failed_when: false
  when: caddy_upgrade | bool

- name: Decidir se precisa baixar
  ansible.builtin.set_fact:
    caddy_needs_download: >-
      {{ caddy_local_version.rc != 0
         or (caddy_upgrade | bool
             and (caddy_release.json.tag_name | default('')) not in caddy_local_version.stdout) }}

- name: Baixar binário custom com plugin cloudflare
  ansible.builtin.get_url:
    url: "{{ caddy_download_url }}"
    dest: /tmp/caddy
    mode: "0755"
    owner: root
    group: root
  when: caddy_needs_download | bool

# O apt continua dono do caddy.default: um upgrade do pacote grava lá, e
# não por cima do binário custom.
- name: Desviar /usr/bin/caddy para caddy.default
  community.general.dpkg_divert:
    path: /usr/bin/caddy
    divert: /usr/bin/caddy.default
    rename: true

# No --check o get_url não baixa nada; sem isto o copy falha com
# "Source /tmp/caddy not found". O dry-run ainda mostra o download como
# changed — é o sinal de que a aplicação vai trocar o binário.
- name: Mover binário custom para o path final
  ansible.builtin.copy:
    src: /tmp/caddy
    dest: /usr/bin/caddy.custom
    mode: "0755"
    owner: root
    group: root
    remote_src: true
  when:
    - caddy_needs_download | bool
    - not ansible_check_mode
  # Sem restart o processo segue rodando o binário antigo (inode aberto).
  # O copy só marca changed quando o conteúdo muda, então o restart
  # só dispara quando há versão nova de fato.
  notify: Restart caddy

- name: Limpar binário temporário
  ansible.builtin.file:
    path: /tmp/caddy
    state: absent
  when: caddy_needs_download | bool

# Modo auto: vence a maior prioridade, o custom. O default fica registrado
# para voltar com update-alternatives --config caddy.
- name: Registrar os binários em update-alternatives
  community.general.alternatives:
    name: caddy
    link: /usr/bin/caddy
    path: "{{ item.path }}"
    priority: "{{ item.priority }}"
    state: "{{ item.state }}"
  loop:
    - {path: /usr/bin/caddy.default, priority: 10, state: present}
    - {path: /usr/bin/caddy.custom, priority: 50, state: auto}
  loop_control:
    label: "{{ item.path }}"

- name: Verificar que o plugin cloudflare está disponível
  ansible.builtin.command: caddy list-modules
  register: caddy_modules
  changed_when: false
  failed_when: "'dns.providers.cloudflare' not in caddy_modules.stdout"

- name: Renderizar Caddyfile
  ansible.builtin.template:
    src: "{{ caddy_caddyfile_template }}"
    dest: "{{ caddy_config_dir }}/Caddyfile"
    owner: root
    group: caddy
    mode: "0644"
    # O validate chama caddy com provisioning real, e o módulo cloudflare
    # exige o token para validar formato. O validate NÃO passa por shell
    # (shlex.split + execvp), então "VAR=x cmd" não funciona — o Ansible
    # procuraria um binário chamado "VAR=x". Por isso o /usr/bin/env:
    # ele seta a variável e dá exec no caddy.
    # O env file (cf-token.env) ainda não existe neste ponto — ele é
    # escrito logo abaixo.
    validate: "/usr/bin/env {{ caddy_cloudflare_env_var }}={{ caddy_cloudflare_token }} caddy validate --adapter caddyfile --config %s"
  no_log: true
  # Mudança só de config não precisa derrubar conexões: reload é graceful.
  # Binário e env file continuam com Restart (reload não relê EnvironmentFile).
  notify: Reload caddy

- name: Renderizar env file com token Cloudflare
  ansible.builtin.copy:
    dest: "{{ caddy_env_file }}"
    owner: root
    group: caddy
    mode: "0640"
    content: |
      # Gerido pelo Ansible — não editar à mão
      {{ caddy_cloudflare_env_var }}={{ caddy_cloudflare_token }}
  no_log: true
  notify: Restart caddy

- name: Diretório do drop-in do systemd
  ansible.builtin.file:
    path: "{{ caddy_systemd_drop_in | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Drop-in do systemd com EnvironmentFile
  ansible.builtin.copy:
    dest: "{{ caddy_systemd_drop_in }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Service]
      EnvironmentFile={{ caddy_env_file }}
  notify:
    - Reload systemd
    - Restart caddy

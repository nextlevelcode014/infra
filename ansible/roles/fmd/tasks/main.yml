---
- name: Preparar o diretório da stack
  ansible.builtin.include_role:
    name: compose_stack
    tasks_from: dir
  vars:
    compose_stack_dir: "{{ fmd_dir }}"

# O container roda como uid 1000 e precisa escrever no banco; sem isso o
# SQLite falha e o container reinicia em loop (era um chown manual).
- name: Criar o diretório do banco no volume cifrado
  ansible.builtin.file:
    path: "{{ fmd_data_dir }}/fmddata/db"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Criar o diretório de estado do sidecar no volume cifrado
  ansible.builtin.file:
    path: "{{ fmd_data_dir }}/tailscale-state"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: fmd_tailscale_sidecar

# O ts-serve.json só é lido na partida do sidecar: mudou (ex.: o Funnel passou
# a apontar para o Anubis), a stack é recriada mais abaixo.
- name: Renderizar o ts-serve.json
  ansible.builtin.template:
    src: ts-serve.json.j2
    dest: "{{ fmd_dir }}/ts-serve.json"
    mode: "0644"
  register: fmd_ts_serve_result

# public: os defaults do role anubis (anubis_image, anubis_difficulty) ficam
# visíveis para o compose.yml.j2 abaixo.
- name: Renderizar a política do Anubis do Funnel
  ansible.builtin.include_role:
    name: anubis
    tasks_from: policy
    public: true
  vars:
    anubis_policy: "{{ fmd_anubis_policy }}"
    anubis_policy_dest: "{{ fmd_dir }}/anubis-policy.yaml"
  when: fmd_tailscale_sidecar and fmd_anubis

- name: Renderizar o .env
  ansible.builtin.template:
    src: fmd.env.j2
    dest: "{{ fmd_dir }}/.env"
    mode: "0600"
  no_log: true

- name: Subir o FMD
  ansible.builtin.include_role:
    name: compose_stack
  vars:
    compose_stack_dir: "{{ fmd_dir }}"

# Recria a stack inteira, não só o sidecar: o fmd e o Anubis vivem na rede
# dele, e reiniciar só o sidecar os deixaria presos a uma netns que sumiu.
# O estado do nó (e o Funnel) fica no volume, então é o mesmo nó.
- name: Recriar a stack com o ts-serve.json novo
  community.docker.docker_compose_v2:
    project_src: "{{ fmd_dir }}"
    files: [compose.yml]
    state: present
    recreate: always
  when:
    - fmd_tailscale_sidecar
    - fmd_ts_serve_result is changed
    - not ansible_check_mode

- name: Reiniciar o Anubis com a política nova
  community.docker.docker_compose_v2:
    project_src: "{{ fmd_dir }}"
    files: [compose.yml]
    state: restarted
    services: [fmd-anubis]
  when:
    - fmd_tailscale_sidecar and fmd_anubis
    - anubis_policy_result is changed
    - not ansible_check_mode

# Para só o fmd (o sidecar e o Funnel continuam) enquanto o Borg copia o
# SQLite. O estado do sidecar vai junto: num Pi reconstruído, o Funnel volta
# com a mesma URL.
- name: Configurar o backup do FMD
  ansible.builtin.include_role:
    name: borg_client
    tasks_from: backup
  vars:
    borg_backup_name: fmd
    borg_backup_sources: >-
      {{ [fmd_data_dir ~ '/fmddata']
         + ([fmd_data_dir ~ '/tailscale-state'] if fmd_tailscale_sidecar else []) }}
    borg_backup_commands:
      - before: action
        when: [create]
        run:
          - docker compose -f {{ fmd_dir }}/compose.yml stop fmd
      - after: action
        when: [create]
        run: &fmd_backup_up
          - docker compose -f {{ fmd_dir }}/compose.yml start fmd
      - after: error
        run: *fmd_backup_up

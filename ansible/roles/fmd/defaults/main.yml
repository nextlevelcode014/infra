---
fmd_dir: /opt/fmd
fmd_image: registry.gitlab.com/fmd-foss/fmd-server:0.16.0

# Banco (SQLite em WAL) e estado do sidecar no LUKS.
fmd_data_dir: "{{ appdata_dir }}/fmd"

# Sidecar Tailscale com Funnel: fmd.<tailnet>.ts.net fica PÚBLICO de
# propósito, para abrir o FMD de qualquer aparelho numa emergência sem
# depender da tailnet. Desligado no pi-lab (entraria na tailnet como outro
# "fmd", com Funnel). O uso normal é pelo Caddy, em fmd.lab.
fmd_tailscale_sidecar: true
fmd_ts_authkey: "{{ vault_fmd_ts_authkey }}"

# Anubis no nó do Funnel: o tráfego da internet passa por uma prova de
# trabalho antes de chegar ao FMD, inclusive a API de login. Sem isso,
# qualquer bot trava a conta (5 senhas erradas = 10 min, por usuário) bem na
# hora da emergência. Quem chega pela tailnet (o app do celular, que não roda
# JavaScript) passa direto; o fmd.lab nem passa pelo Anubis.
# Só vale com o sidecar (o pi-lab desliga os dois).
fmd_anubis: true
# O nome do Funnel: o Anubis só redireciona para ele depois do desafio.
fmd_funnel_host: fmd.<tailnet>.ts.net
fmd_anubis_policy:
  allow_crawlers: false
  rules:
    # Tailnet passa direto. O tailscale serve apaga o Tailscale-Funnel-Request
    # que vier do cliente e só o recoloca (?1) em requisição que chegou pelo
    # Funnel: ausente = tailnet, e da internet não dá para forjar.
    - name: tailnet-direto
      action: ALLOW
      expression: '!("Tailscale-Funnel-Request" in headers)'
    # Da internet, só o /api/v1/version escapa do desafio, para o monitor do
    # Uptime Kuma: a página de desafio responde 200 e o deixaria sempre verde.
    - name: fmd-version
      action: ALLOW
      path_regex: ^/api/v1/version$

# Exposto na internet pelo Funnel: vazio NÃO fecha o cadastro (o viper
# ignora env vazia e cai no default, que é aberto).
fmd_registration_token: "{{ vault_fmd_registration_token }}"
fmd_max_saved_loc: 500
fmd_max_saved_pic: 10

# Porta para o Caddy, no IP Tailscale do Pi.
fmd_web_port: 8085

---
# Servidor Borg num desktop Arch (Omarchy) que não é da infra: o role só
# mexe no que o Borg precisa (disco, usuário borg, sshd) e deixa o resto do
# desktop como está. docs/borg-offsite.md.

# Disco dos repositórios, formatado à mão com este label (mkfs.ext4 -L).
# Pelo label, e não pelo /dev/nvmeXn1: o nome do dispositivo muda entre boots.
borg_server_disk_label: borg
borg_server_dir: "{{ borg_offsite_dir }}"

# Dono dos repositórios. A home fica fora do disco do Borg: com o NVMe fora,
# o authorized_keys continua lá e o borg serve falha no caminho, em vez de
# o sshd recusar a chave sem dizer por quê.
borg_server_user: borg
borg_server_home: /var/lib/borg

# Usuário com que o Ansible entra (criado à mão no bootstrap, com sudo sem
# senha). O sshd só aceita os dois, e só vindo da tailnet.
borg_server_admin_user: infra
borg_server_allowed_networks:
  - 100.64.0.0/10
  - fd7a:115c:a1e0::/48

# Um repositório por cliente, cada chave presa ao seu (borg serve
# --restrict-to-repository). Chave vazia = cliente ainda sem chave (o AIO só
# mostra a dele depois da primeira tentativa): o diretório é criado, a linha
# no authorized_keys não.
borg_server_repos:
  - name: immich
    key: "{{ vault_borg_offsite_pi_public_key }}"
  - name: nextcloud
    key: "{{ vault_borg_offsite_aio_public_key | default('') }}"

---
- name: Preparar os diretórios DKIM do Rspamd
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ mailserver_dkim_dir }}"
    - "{{ mailserver_rspamd_dir }}/override.d"
  register: mailserver_dkim_diretorios

- name: Gerar uma chave RSA por domínio sem substituir chaves existentes
  ansible.builtin.command:
    expand_argument_vars: false
    argv:
      - docker
      - run
      - --rm
      - --network=none
      - --volume={{ mailserver_dkim_dir }}:/dkim
      - --entrypoint=/bin/sh
      - "{{ mailserver_image }}"
      - -ec
      # Use o gerador que o rspamd-dkim chama, sem a recarga do daemon.
      # Grave a chave pronta sem sobrescrever a de outra execução.
      - |
        umask 077
        chave=/tmp/dkim.private
        rspamadm dkim_keygen -d "$1" -s "$2" -b 2048 -k "$chave" >/dev/null
        openssl pkey -in "$chave" -check -noout >/dev/null
        temporaria=$(mktemp /dkim/.chave.XXXXXX)
        trap 'rm -f -- "$temporaria"' EXIT
        install -o _rspamd -g _rspamd -m 0600 "$chave" "$temporaria"
        if ! ln -- "$temporaria" "/dkim/$3"; then
          test -s "/dkim/$3"
        fi
      - gerar-dkim
      - "{{ item }}"
      - "{{ mailserver_seletor }}"
      - "{{ item }}-{{ mailserver_seletor }}.private"
    creates: "{{ mailserver_dkim_dir }}/{{ item }}-{{ mailserver_seletor }}.private"
  loop: "{{ mailserver_dkim_dominios }}"

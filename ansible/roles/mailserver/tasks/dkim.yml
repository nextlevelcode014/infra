---
- name: Preparar as chaves dos domínios ativos
  ansible.builtin.import_tasks: dkim-chaves.yml
  vars:
    mailserver_dkim_dominios: "{{ mailserver_dominios_ativos }}"

- name: Configurar assinatura DKIM com o domínio exato do remetente
  ansible.builtin.template:
    src: dkim_signing.conf.j2
    dest: "{{ mailserver_rspamd_dir }}/override.d/dkim_signing.conf"
    owner: root
    group: root
    mode: "0644"
  when: not (ansible_check_mode and mailserver_dkim_diretorios is changed)

---
- name: Validar a declaração usada pela prévia
  ansible.builtin.import_tasks: validar.yml

- name: Conferir as duas caixas no Dovecot em execução
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - compose.yml
      - exec
      - -T
      - mailserver
      - doveadm
      - user
      - "{{ item }}@{{ mailserver_zona }}"
    chdir: "{{ mailserver_dir }}"
  loop: ["{{ mailserver_principal_config.pessoal }}", "{{ mailserver_principal_config.trabalho }}"]
  changed_when: false
  check_mode: false
  no_log: true

- name: Conferir as rotas no mapa ativo do Postfix
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - compose.yml
      - exec
      - -T
      - mailserver
      - postmap
      - -q
      - "{{ item.key }}@{{ mailserver_zona }}"
      - texthash:/etc/postfix/virtual
    chdir: "{{ mailserver_dir }}"
  loop: >-
    {{ mailserver_aliases[mailserver_zona]
       | combine({mailserver_principal_config.pessoal: mailserver_principal_config.pessoal,
                  mailserver_principal_config.trabalho: mailserver_principal_config.trabalho,
                  '': mailserver_catch_all[mailserver_zona]})
       | dict2items }}
  register: mailserver_migracao_alias
  failed_when: >-
    mailserver_migracao_alias.rc != 0 or
    mailserver_migracao_alias.stdout != (item.value ~ '@' ~ mailserver_zona)
  changed_when: false
  check_mode: false
  no_log: true

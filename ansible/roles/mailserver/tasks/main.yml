---
- name: Validar a estrutura das contas e preservar as caixas do piloto
  ansible.builtin.assert:
    that:
      - mailserver_contas[mailserver_dominio] is mapping
      - "'ana' in mailserver_contas[mailserver_dominio] and 'bruno' in mailserver_contas[mailserver_dominio]"
      - mailserver_contas[mailserver_dominio_adocao] is mapping
    fail_msg: Preencha os mapas de contas como no exemplo do vault.
  no_log: true

- name: Validar usuários, destinos dos aliases e hashes por domínio
  ansible.builtin.assert:
    that:
      - contas.keys() | reject('match', '^[a-z][a-z0-9_.-]*\\Z') | list | length == 0
      - contas.values() | reject('match', '^\\$6\\$[./A-Za-z0-9]+\\$[./A-Za-z0-9]{86}\\Z') | list | length == 0
      - mailserver_aliases[item].values() | difference(contas.keys()) | length == 0
      - mailserver_aliases[item].keys() | intersect(contas.keys()) | length == 0
    fail_msg: Preencha o vault com hashes gerados por openssl passwd -6.
  vars:
    contas: "{{ mailserver_contas[item] }}"
  loop: "{{ mailserver_dominios_ativos }}"
  no_log: true

- name: Garantir o Docker na VPS
  ansible.builtin.include_role:
    name: geerlingguy.docker
  vars:
    docker_users: []

- name: Preparar o diretório da stack
  ansible.builtin.include_role:
    name: compose_stack
    tasks_from: dir
  vars:
    compose_stack_dir: "{{ mailserver_dir }}"

- name: Restringir o acesso aos dados persistentes no host
  ansible.builtin.file:
    path: "{{ mailserver_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# O Dovecot grava com UID/GID 5000 na imagem. Postfix e Rspamd precisam
# atravessar as outras montagens, enquanto o diretório pai protege no host.
- name: Preparar os volumes persistentes com as permissões do Mailserver
  ansible.builtin.file:
    path: "{{ mailserver_data_dir }}/{{ item.nome }}"
    state: directory
    owner: "{{ item.dono }}"
    group: "{{ item.grupo }}"
    mode: "{{ item.modo }}"
  loop:
    - {nome: mail, dono: "5000", grupo: "5000", modo: "0700"}
    - {nome: estado, dono: root, grupo: root, modo: "0711"}
    - {nome: config, dono: root, grupo: root, modo: "0711"}

- name: Configurar as contas dos domínios ativos
  ansible.builtin.template:
    src: postfix-accounts.cf.j2
    dest: "{{ mailserver_data_dir }}/config/postfix-accounts.cf"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Configurar os aliases locais dos domínios ativos
  ansible.builtin.template:
    src: postfix-virtual.cf.j2
    dest: "{{ mailserver_data_dir }}/config/postfix-virtual.cf"
    owner: root
    group: root
    mode: "0600"

- name: Configurar emissão e renovação do TLS
  ansible.builtin.import_tasks: tls.yml

- name: Preparar a assinatura DKIM por domínio
  ansible.builtin.import_tasks: dkim.yml

- name: Subir o Docker Mailserver
  ansible.builtin.include_role:
    name: compose_stack
  vars:
    compose_stack_dir: "{{ mailserver_dir }}"
    compose_stack_wait: true

# O DMS copia os overrides ao iniciar. Compare com a cópia do container para
# também concluir uma aplicação anterior interrompida antes da recriação.
- name: Conferir se o container recebeu a configuração DKIM
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - compose.yml
      - exec
      - -T
      - mailserver
      - cmp
      - -s
      - /tmp/docker-mailserver/rspamd/override.d/dkim_signing.conf
      - /etc/rspamd/override.d/dkim_signing.conf
    chdir: "{{ mailserver_dir }}"
  register: mailserver_dkim_config_no_container
  changed_when: false
  failed_when: mailserver_dkim_config_no_container.rc not in [0, 1, 2]
  when: not ansible_check_mode

- name: Recriar o Mailserver para carregar a configuração DKIM
  community.docker.docker_compose_v2:
    project_src: "{{ mailserver_dir }}"
    files: [compose.yml]
    services: [mailserver]
    state: present
    recreate: always
    wait: true
  when:
    - not ansible_check_mode
    - mailserver_dkim_config_no_container.rc != 0

- name: Publicar as portas de cliente na tailnet
  ansible.builtin.import_tasks: tailscale.yml

- name: Preparar o cliente Borg
  ansible.builtin.include_role:
    name: borg_client

- name: Configurar o backup Borg do Mailserver
  ansible.builtin.include_role:
    name: borg_client
    tasks_from: backup
  vars:
    borg_backup_name: mailserver
    borg_backup_sources:
      - "{{ mailserver_data_dir }}"
    borg_backup_commands:
      - before: action
        when: [create]
        run:
          - docker compose -f {{ mailserver_dir }}/compose.yml stop mailserver
      - after: action
        when: [create]
        run: &mailserver_backup_start
          - docker compose -f {{ mailserver_dir }}/compose.yml start mailserver
      - after: error
        run: *mailserver_backup_start

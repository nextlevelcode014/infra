---
- name: Instalar pacotes base
  ansible.builtin.apt:
    name: "{{ pi_packages }}"
    state: present

# No Pi o Ubuntu já cria o ubuntu (uid 1000); no pi-lab não. Os composes e
# os dados usam esse uid.
- name: Garantir o usuário admin com o uid dos containers
  ansible.builtin.user:
    name: "{{ admin_user }}"
    uid: "{{ puid }}"

# --- Fonte (EEPROM) ---------------------------------------------------------
# A fonte oficial de 27W chega sem negociação USB-PD (PDOs zerados no
# device tree), então o firmware assume uma fonte fraca, limita a USB e,
# com boot pela USB, para pedindo o botão de power. PSU_MAX_CURRENT diz a
# ele a corrente real. Só vale no Pi físico: quem não define pi_psu_max_current pula.
# A EEPROM nova entra no próximo reboot; o role não reinicia sozinho.

- name: Declarar a corrente da fonte na EEPROM (só no Pi físico)
  when: pi_psu_max_current is defined
  block:
    - name: Ler a config atual da EEPROM
      ansible.builtin.command:
        argv: [rpi-eeprom-config]
      changed_when: false
      check_mode: false
      register: pi_eeprom_config

    - name: Agendar a EEPROM com a corrente da fonte
      when: ("PSU_MAX_CURRENT=" ~ pi_psu_max_current) not in pi_eeprom_config.stdout_lines
      block:
        - name: Gravar a config nova num arquivo temporário
          ansible.builtin.copy:
            dest: /var/tmp/pi-eeprom.conf
            mode: "0644"
            content: |
              {% for line in pi_eeprom_config.stdout_lines if not line.startswith('PSU_MAX_CURRENT=') %}
              {{ line }}
              {% endfor %}
              PSU_MAX_CURRENT={{ pi_psu_max_current }}

        - name: Agendar a gravação da EEPROM para o próximo boot
          ansible.builtin.command:
            argv: [rpi-eeprom-config, --apply, /var/tmp/pi-eeprom.conf]
          changed_when: true

        - name: Avisar que falta reiniciar
          ansible.builtin.debug:
            msg: >-
              EEPROM agendada com PSU_MAX_CURRENT={{ pi_psu_max_current }}.
              Vale no próximo reboot; depois dele rode o secure-unlock
              (docs/pi.md, "Fonte e boot sozinho").

# --- Watchdog de hardware ---------------------------------------------------
# O Pi já travou sem deixar uma linha no journal e ficou fora até alguém
# tirar da tomada. Com o watchdog, o systemd chuta o timer do chip a cada
# poucos segundos; se o kernel trava, ninguém chuta e o chip reinicia a
# placa. 15 s é o máximo do bcm2835-wdt. No pi-lab (LXC) não há chip: pula.

- name: Ligar o watchdog de hardware no systemd (só fora de container)
  when: ansible_facts.virtualization_type != 'lxc'
  block:
    - name: Criar o diretório de drop-in do systemd
      ansible.builtin.file:
        path: /etc/systemd/system.conf.d
        state: directory
        mode: "0755"

    - name: Configurar o watchdog no systemd
      ansible.builtin.copy:
        dest: /etc/systemd/system.conf.d/watchdog.conf
        mode: "0644"
        content: |
          [Manager]
          RuntimeWatchdogSec={{ pi_watchdog_sec }}
      notify: Reexecutar o systemd

# --- LUKS -------------------------------------------------------------------
# Criar a partição cifrada (luksFormat + mkfs) é manual e acontece uma vez:
# precisa da passphrase, que não pode viver em lugar nenhum daqui. Ver
# docs/pi.md. Aqui só se registra o mapeamento, com noauto para o boot não
# travar pedindo senha.

- name: Registrar o LUKS (só em host que tem)
  when: pi_luks_uuid is defined
  block:
    - name: Registrar o volume cifrado no crypttab
      community.general.crypttab:
        name: "{{ pi_luks_name }}"
        backing_device: "UUID={{ pi_luks_uuid }}"
        password: none
        opts: luks,noauto
        state: present

    # state: present só escreve no fstab; montar é o secure-unlock.
    - name: Registrar o ponto de montagem no fstab
      ansible.posix.mount:
        path: "{{ secure_mount_dir }}"
        src: "/dev/mapper/{{ pi_luks_name }}"
        fstype: ext4
        opts: noauto
        dump: "0"
        passno: "2"
        state: present

    - name: Instalar o script de destravar o volume
      ansible.builtin.template:
        src: secure-unlock.sh.j2
        dest: "{{ pi_unlock_script }}"
        owner: root
        group: root
        mode: "0755"

# Daqui para baixo tudo depende do volume aberto. No pi-lab o /mnt/secure é
# um volume do Proxmox, mas a guarda é a mesma.
- name: Confirmar que o volume cifrado está montado
  ansible.builtin.command:
    argv: [mountpoint, -q, "{{ secure_mount_dir }}"]
  changed_when: false
  check_mode: false
  register: pi_secure_mounted
  failed_when: false

- name: Exigir o volume cifrado destravado
  ansible.builtin.assert:
    that: pi_secure_mounted.rc == 0
    fail_msg: >-
      {{ secure_mount_dir }} não está montado. Entre no Pi e rode
      `{{ pi_unlock_script }}` (pede a passphrase do LUKS), depois rode
      o playbook de novo. No pi-lab, confira o mount point no Terraform.

# Não recursivo: só a raiz, para o admin gravar appdata/ e env/ sem sudo.
# O data-root do Docker (docker/) continua de root.
- name: Ajustar o dono da raiz do volume cifrado
  ansible.builtin.file:
    path: "{{ secure_mount_dir }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"

- name: Criar o diretório de dados dos serviços
  ansible.builtin.file:
    path: "{{ appdata_dir }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0775"

# --- Docker -----------------------------------------------------------------
# data-root no volume cifrado cifra também os volumes nomeados e as
# imagens. containerd-snapshotter:false é ESSENCIAL: o Docker >=25 guarda as
# imagens em /var/lib/containerd (na raiz!) ignorando o data-root; com o
# snapshotter desligado (overlay2) elas também vão para o volume cifrado.
# A chave é uma válvula de escape temporária do Docker — rever em upgrades.
# Não é o docker_daemon_options do geerlingguy.docker de propósito: ele grava
# o daemon.json depois de instalar o pacote, e o docker-ce sobe na instalação
# — num host novo, o Docker criaria /var/lib/docker na raiz, fora do LUKS.

- name: Criar diretório de config do Docker
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Configurar o data-root do Docker no volume cifrado
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
      {% if 'lxc' in group_names %}
        "dns": ["{{ lxc_dns_docker_address | default(ansible_facts.docker0.ipv4.address | default('172.17.0.1')) }}"],
      {% endif %}
        "data-root": "{{ secure_mount_dir }}/docker",
        "features": { "containerd-snapshotter": false }
      }
  register: pi_docker_daemon_json

- name: Criar diretório de drop-in do Docker
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: Impedir o Docker de subir sem o volume cifrado
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/require-secure.conf
    mode: "0644"
    content: |
      [Unit]
      RequiresMountsFor={{ secure_mount_dir }}
  register: pi_docker_dropin

# O geerlingguy.docker só atualiza o cache quando adiciona o repositório. Se
# uma execução parar depois disso, a próxima acha o repo sem o cache e falha
# com "No package matching 'docker-ce'".
- name: Atualizar o cache do apt antes do Docker
  ansible.builtin.apt:
    update_cache: true
  changed_when: false

# Com LUKS, desabilitado no boot: quem sobe o Docker é o secure-unlock,
# depois de abrir o volume. Sem LUKS (pi-lab) o volume monta sozinho, então
# o Docker sobe no boot.
- name: Instalar Docker
  ansible.builtin.include_role:
    name: geerlingguy.docker
  vars:
    docker_service_enabled: "{{ pi_luks_uuid is not defined }}"
    docker_users:
      - "{{ admin_user }}"

# Task, não handler: o geerlingguy.docker roda flush_handlers no meio da
# instalação, e um handler de restart disparava antes de o Docker existir.
# Num host novo a config já está no lugar no primeiro start; isto só pega
# mudança num Docker já instalado.
- name: Reiniciar o Docker se a config mudou
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
    daemon_reload: true
  when: pi_docker_daemon_json is changed or pi_docker_dropin is changed

- name: Criar as redes Docker compartilhadas
  community.docker.docker_network:
    name: "{{ item }}"
  loop: "{{ pi_docker_networks }}"

# --- Backup só com o LUKS aberto -------------------------------------------
# O borgmatic.timer é Persistent: depois de um boot ele roda na hora, antes do
# secure-unlock, e todo config falha sem Docker e sem appdata (os hooks de
# up -d também). Com a condição, a execução é pulada sem erro; quem avisa é o
# monitor, depois de 26 h sem push. ConditionPathIsMountPoint, e não
# RequiresMountsFor: esse monta o volume e fica pedindo a passphrase.
# Sem LUKS (pi-lab), /mnt/secure não é ponto de montagem e o backup nunca
# rodaria.
- name: Criar diretório de drop-in do borgmatic
  ansible.builtin.file:
    path: /etc/systemd/system/borgmatic.service.d
    state: directory
    mode: "0755"
  when: pi_luks_uuid is defined

- name: Pular o backup com o volume cifrado fechado
  ansible.builtin.copy:
    dest: /etc/systemd/system/borgmatic.service.d/require-secure.conf
    mode: "0644"
    content: |
      [Unit]
      ConditionPathIsMountPoint={{ secure_mount_dir }}
  when: pi_luks_uuid is defined
  notify: Recarregar systemd

# --- Guarda de espaço livre -------------------------------------------------
# O /mnt/secure é de todos (data-root do Docker, Postgres). Se os downloads
# o encherem, cai tudo; o qBittorrent só reage depois que a escrita falha.

- name: Instalar o disk-guard
  ansible.builtin.template:
    src: disk-guard.sh.j2
    dest: "{{ pi_disk_guard_script }}"
    owner: root
    group: root
    mode: "0755"

- name: Instalar as units do disk-guard
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - disk-guard.service
    - disk-guard.timer
  notify: Recarregar systemd

- name: Aplicar mudanças de units antes de ativar o timer
  ansible.builtin.meta: flush_handlers

- name: Ativar o timer do disk-guard
  ansible.builtin.systemd_service:
    name: disk-guard.timer
    state: started
    enabled: true

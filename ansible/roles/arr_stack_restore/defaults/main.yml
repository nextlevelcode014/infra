---
arr_restore_confirmation: ""
# Dentro do LUKS, não em /var/tmp: no Pi a raiz não é cifrada e a config
# tem API keys e bancos. Também é onde há espaço (a raiz tem ~14 GB).
arr_restore_work_dir: "{{ secure_mount_dir }}/restore/arr"

arr_restore_stack_dir: /opt/arr

# Subir a stack depois de restaurar. Desligado no pi-lab: com a config de
# produção, o qBittorrent retomaria os torrents (sem a mídia, baixaria tudo
# de novo) e os *arr disparariam buscas. Lá se sobe só o que vai conferir.
arr_restore_start_stack: true

# Destino real da config: /mnt/media-stack/config é symlink para cá.
# O restore grava aqui direto, sem passar pelo link.
arr_restore_config_dir: "{{ appdata_dir }}/mnt/media-stack/config"

# Caminho dentro do archive Borg (com a barra inicial removida). O
# backup-arr.sh guarda a config inteira pelo caminho real.
arr_restore_data_archive_path: "{{ arr_restore_config_dir | regex_replace('^/', '') }}"

# Arquivos que precisam existir no archive para o restore seguir.
arr_restore_required_files:
  - sonarr/config.xml
  - radarr/config.xml

# Pastas excluídas do backup ('sh:**/cache') que o Docker precisa encontrar
# já existentes.
arr_restore_excluded_dirs:
  - jellyfin/cache

# Hostname da máquina cujos backups valem para o restore (o Raspberry Pi). Archives
# arr-* de outras máquinas são ignorados.
arr_restore_source_host: ubuntu

---
# network_mode "container:gluetun" vira o ID do gluetun na criação do
# container. Recriado o gluetun, quem dependia dele aponta para um ID que não
# existe mais e fica sem rede; reiniciar não resolve, só recriar. Comparar os
# IDs (em vez de "o gluetun mudou agora") conserta também o que ficou quebrado
# numa execução anterior.
- name: Ler o gluetun atual
  community.docker.docker_container_info:
    name: gluetun
  register: gluetun_info

- name: Ler os containers que dependem do gluetun
  community.docker.docker_container_info:
    name: "{{ item }}"
  loop: "{{ gluetun_dependents }}"
  register: gluetun_dependents_info

# Pelos labels do Compose, recria no projeto de onde o container veio: cada
# dependente mora na stack dele (/opt/arr, /opt/searxng).
- name: Recriar os dependentes presos a um gluetun antigo
  community.docker.docker_compose_v2:
    project_src: "{{ labels['com.docker.compose.project.working_dir'] }}"
    files: "{{ labels['com.docker.compose.project.config_files'].split(',') }}"
    services:
      - "{{ labels['com.docker.compose.service'] }}"
    recreate: always
    state: present
  vars:
    labels: "{{ item.container.Config.Labels }}"
  loop: "{{ gluetun_dependents_info.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.exists
    - item.container.HostConfig.NetworkMode != 'container:' ~ gluetun_info.container.Id

---
# Gateway VPN compartilhado (ProtonVPN, WireGuard, killswitch). Redes
# medianet e vpn_net vêm do pi_host.
- name: Criar o diretório da stack
  ansible.builtin.file:
    path: "{{ gluetun_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  register: gluetun_stack_dir_result

- name: Copiar o compose.yml
  ansible.builtin.copy:
    src: compose.yml
    dest: "{{ gluetun_dir }}/compose.yml"
    mode: "0644"

- name: Renderizar o .env
  ansible.builtin.template:
    src: gluetun.env.j2
    dest: "{{ gluetun_dir }}/.env"
    mode: "0600"
  no_log: true

- name: Subir o gluetun
  community.docker.docker_compose_v2:
    project_src: "{{ gluetun_dir }}"
    files: [compose.yml]
    state: present
    wait: true
  # No --check de um host novo o diretório só "seria" criado, e o compose
  # falha com "is not a directory". Pula só nesse caso.
  when: not (ansible_check_mode and gluetun_stack_dir_result is changed)

# Separado para o pi-atualizar.yml chamar sem passar pelo role inteiro.
- name: Recriar os dependentes do gluetun, se preciso
  ansible.builtin.include_tasks: dependentes.yml

---
# Gateway VPN compartilhado (ProtonVPN, WireGuard, killswitch). Redes
# medianet e vpn_net vêm do pi_host.
- name: Criar o diretório da stack
  ansible.builtin.file:
    path: "{{ gluetun_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Copiar o compose.yml
  ansible.builtin.copy:
    src: compose.yml
    dest: "{{ gluetun_dir }}/compose.yml"
    mode: "0644"

- name: Renderizar o .env
  ansible.builtin.template:
    src: gluetun.env.j2
    dest: "{{ gluetun_dir }}/.env"
    mode: "0600"
  no_log: true

- name: Subir o gluetun
  community.docker.docker_compose_v2:
    project_src: "{{ gluetun_dir }}"
    files: [compose.yml]
    state: present
    wait: true

# network_mode "container:gluetun" vira o ID do gluetun na criação do
# container. Recriado o gluetun, quem dependia dele aponta para um ID que não
# existe mais e fica sem rede; reiniciar não resolve, só recriar. Comparar os
# IDs (em vez de "o gluetun mudou agora") conserta também o que ficou quebrado
# numa execução anterior.
- name: Ler o gluetun atual
  community.docker.docker_container_info:
    name: gluetun
  register: gluetun_info

- name: Ler os containers que dependem do gluetun
  community.docker.docker_container_info:
    name: "{{ item }}"
  loop: "{{ gluetun_dependents }}"
  register: gluetun_dependents_info

# Pelos labels do Compose, recria no projeto de onde o container veio — vale
# para stack do Ansible (/opt/...) e para a que ainda sobe pelo self-hosted.
- name: Recriar os dependentes presos a um gluetun antigo
  community.docker.docker_compose_v2:
    project_src: "{{ labels['com.docker.compose.project.working_dir'] }}"
    files: "{{ labels['com.docker.compose.project.config_files'].split(',') }}"
    services:
      - "{{ labels['com.docker.compose.service'] }}"
    recreate: always
    state: present
  vars:
    labels: "{{ item.container.Config.Labels }}"
  loop: "{{ gluetun_dependents_info.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.exists
    - item.container.HostConfig.NetworkMode != 'container:' ~ gluetun_info.container.Id

---
# O compose fixa o projeto em "nextcloud-aio" (name:) e o volume do
# mastercontainer em "nextcloud_aio_mastercontainer", nomes que o AIO exige.
# Os outros containers (nextcloud-aio-*) são criados e geridos pelo próprio
# AIO, não pelo Ansible.
nextcloud_dir: /opt/nextcloud-aio

# latest (ADR 0013): o mastercontainer se atualiza pela própria interface,
# puxando a imagem nova do canal (latest ou beta). Versão fixa brigaria com
# isso.
nextcloud_aio_image: ghcr.io/nextcloud-releases/all-in-one:latest

# Onde o Apache do AIO escuta a porta 11000. O IP Tailscale do Pi, para o
# Caddy do Proxmox (nextcloud.lab.nextlevelcode.pro) alcançar.
nextcloud_apache_ip_binding: "{{ ts_ip }}"

# coturn (TURN/STUN do Talk na tailnet), em compose próprio com network_mode
# host. O projeto "coturn-turn" também vem do name: do compose.
nextcloud_coturn_dir: /opt/coturn-turn
# Major (ADR 0005). Sem estado: a config toda vem do command do compose.
# Desde a 4.18 o DTLS só liga com --dtls e o --no-dtls deixou de existir
# (com ele o coturn nem sobe); o --no-tls sozinho já desliga os dois.
nextcloud_coturn_image: coturn/coturn:4
nextcloud_turn_secret: "{{ vault_nextcloud_turn_secret }}"
nextcloud_turn_relay_ip: "{{ ts_ip }}"
nextcloud_ts_tailnet: "{{ tailnet }}"

# Portas UDP de relay do coturn: uma por participante que passa pelo relay
# numa chamada. Precisa ser o MESMO intervalo liberado na ACL do Tailscale
# (udp:49160-49200); fora dele, as alocações falham de forma intermitente.
nextcloud_turn_min_port: 49160
nextcloud_turn_max_port: 49200

# Domínio do Nextcloud, servido pelo Caddy. Ele é configurado na interface
# do AIO (docs/nextcloud.md); o role lê o domínio na configuration.json do AIO
# e só tira a 443 do serve quando ele já é este.
nextcloud_domain: "nextcloud.{{ caddy_domain }}"

# tailscale serve do host. Fica só a interface de administração do AIO
# (https://<pi>.<tailnet>:8080, só tailnet). Saem as sobras abaixo e —
# depois da troca de domínio — a 443, que levava ao Nextcloud antes do Caddy.
nextcloud_serve_aio_port: 8080
# Sobras sem destino (nada escuta em 127.0.0.1 nessas portas): 8000 era um
# Funnel PÚBLICO e 9080 um serve da tailnet.
nextcloud_serve_remove_ports: [8000, 9080]

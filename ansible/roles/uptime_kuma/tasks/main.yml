---
# Usuário fora do grupo docker de propósito: estar nele equivale a root sem
# senha. Na VPS, docker roda com sudo.
- name: Instalar Docker
  ansible.builtin.include_role:
    name: geerlingguy.docker
  vars:
    docker_users: []

- name: Criar o diretório do Uptime Kuma
  ansible.builtin.file:
    path: "{{ uptime_kuma_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  register: uptime_kuma_dir_result

- name: Renderizar o compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ uptime_kuma_dir }}/compose.yml"
    mode: "0644"

# --- AutoKuma ---------------------------------------------------------------
- name: Criar os diretórios do AutoKuma
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ uptime_kuma_dir }}/autokuma"
    - "{{ uptime_kuma_dir }}/autokuma/data"
    - "{{ uptime_kuma_monitors_dir }}"

- name: Renderizar o .env do AutoKuma (admin do Uptime Kuma)
  ansible.builtin.template:
    src: autokuma.env.j2
    dest: "{{ uptime_kuma_dir }}/.env"
    mode: "0600"
  no_log: true

# Um .json por entidade; o nome do arquivo é o ID que o AutoKuma usa.
- name: Gerar o aviso por e-mail
  ansible.builtin.template:
    src: autokuma-notification.json.j2
    dest: "{{ uptime_kuma_monitors_dir }}/{{ uptime_kuma_notification_id }}.json"
    mode: "0600"
  no_log: true

- name: Gerar os grupos
  ansible.builtin.template:
    src: autokuma-group.json.j2
    dest: "{{ uptime_kuma_monitors_dir }}/{{ item.id }}.json"
    mode: "0644"
  loop: "{{ uptime_kuma_groups }}"
  loop_control:
    label: "{{ item.id }}"

- name: Gerar os monitores
  ansible.builtin.template:
    src: autokuma-monitor.json.j2
    dest: "{{ uptime_kuma_monitors_dir }}/{{ item.id }}.json"
    mode: "0644"
  loop: "{{ uptime_kuma_monitors }}"
  loop_control:
    label: "{{ item.id }}"

# Push: quem avisa é o borgmatic de cada host, no fim de cada backup. O token
# é o mesmo que o borg_client calcula (borg_backup_push_token).
- name: Gerar os monitores de backup
  ansible.builtin.template:
    src: autokuma-monitor.json.j2
    dest: "{{ uptime_kuma_monitors_dir }}/backup-{{ backup.key }}.json"
    mode: "0600"
  vars:
    borg_backup_name: "{{ backup.key }}"
    item: >-
      {{ uptime_kuma_backup_monitor | combine({
           'id': 'backup-' ~ backup.key,
           'group': uptime_kuma_backup_group,
           'name': 'Backup ' ~ backup.value,
           'push_token': borg_backup_push_token}) }}
  loop: "{{ uptime_kuma_backups | dict2items }}"
  loop_control:
    loop_var: backup
    label: "backup-{{ backup.key }}"
  no_log: true

# Monitor que saiu da lista: o arquivo some e o AutoKuma apaga o monitor
# (AUTOKUMA__ON_DELETE=delete).
- name: Achar arquivos de entidades
  ansible.builtin.find:
    paths: "{{ uptime_kuma_monitors_dir }}"
    patterns: ["*.json"]
  register: uptime_kuma_entity_files

- name: Apagar entidades que saíram da lista
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ uptime_kuma_entity_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: >-
    (item.path | basename | splitext | first)
    not in ([uptime_kuma_notification_id]
            + (uptime_kuma_groups | map(attribute='id') | list)
            + (uptime_kuma_monitors | map(attribute='id') | list)
            + (uptime_kuma_backups | dict2items | map(attribute='key')
               | map('regex_replace', '^', 'backup-') | list))

- name: Subir o Uptime Kuma
  community.docker.docker_compose_v2:
    project_src: "{{ uptime_kuma_dir }}"
    files: [compose.yml]
    state: present
  # No --check de um host novo o diretório só "seria" criado, e o compose
  # falha com "is not a directory". Pula só nesse caso.
  when: not (ansible_check_mode and uptime_kuma_dir_result is changed)

# O acesso é pelo Caddy da VPS (uptime.lab.nextlevelcode.pro, só tailnet),
# configurado pelo playbooks/caddy-vps.yml.

# --- Backup -----------------------------------------------------------------
# Para o Uptime Kuma por alguns segundos enquanto o Borg copia o SQLite. O
# AutoKuma para junto: o restart: true do compose não dispara com stop/start,
# e sozinho ele ficava sem conexão (EngineIO Error) até alguém reiniciá-lo. O
# up -d --wait sobe o Uptime Kuma, espera o healthcheck e só então o AutoKuma
# (depends_on); o aviso de fim do próprio backup vai para o Uptime Kuma.
- name: Configurar o backup do Uptime Kuma
  ansible.builtin.include_role:
    name: borg_client
    tasks_from: backup
  vars:
    borg_backup_name: uptime-kuma
    borg_backup_sources:
      - "{{ uptime_kuma_dir }}/data"
    borg_backup_commands:
      - before: action
        when: [create]
        run:
          - docker compose -f {{ uptime_kuma_dir }}/compose.yml stop autokuma uptime-kuma
      - after: action
        when: [create]
        run: &uptime_kuma_backup_up
          - docker compose -f {{ uptime_kuma_dir }}/compose.yml up -d --wait
      - after: error
        run: *uptime_kuma_backup_up

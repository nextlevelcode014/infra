---
- name: Exigir confirmação explícita do restore
  ansible.builtin.assert:
    that:
      - vaultwarden_restore_confirmation == "RESTORE_VAULTWARDEN"
    fail_msg: >-
      Restore bloqueado. Execute o playbook com
      -e vaultwarden_restore_confirmation=RESTORE_VAULTWARDEN somente
      depois de confirmar que esta instância deve substituir os dados
      atuais.

# O restore substitui os dados de uma instância que já existe; quem instala
# é o playbooks/vaultwarden.yml (LXC) ou o pi-recuperacao.yml (Pi, em standby).
- name: Ver se o Vaultwarden está instalado aqui
  ansible.builtin.stat:
    path: "{{ vaultwarden_dir }}/docker-compose.yml"
  register: vaultwarden_restore_compose

- name: Exigir o Vaultwarden instalado antes de restaurar
  ansible.builtin.assert:
    that: vaultwarden_restore_compose.stat.exists
    fail_msg: >-
      {{ vaultwarden_dir }}/docker-compose.yml não existe. Instale antes: no Pi,
      playbooks/pi-recuperacao.yml (--limit rpi ou pi_staging); no LXC,
      playbooks/vaultwarden.yml.

# O *_archive_path é relativo (como o borg guarda) para dar para trocar com
# -e por um backup antigo; o borg_restore quer caminho absoluto.
- name: Extrair o backup do Vaultwarden
  ansible.builtin.include_role:
    name: borg_restore
  vars:
    borg_restore_prefix: vaultwarden
    borg_restore_source_host: "{{ vaultwarden_restore_source_host }}"
    borg_restore_work_dir: "{{ vaultwarden_restore_work_dir }}"
    borg_restore_paths:
      - "/{{ vaultwarden_restore_data_archive_path }}"
    borg_restore_required_files:
      - "/{{ vaultwarden_restore_data_archive_path }}/db.sqlite3"

- name: Parar os serviços do Vaultwarden antes de substituir os dados
  community.docker.docker_compose_v2:
    project_src: "{{ vaultwarden_dir }}"
    state: absent

- name: Remover dados atuais do Vaultwarden
  ansible.builtin.file:
    path: "{{ vaultwarden_dir }}/vw-data"
    state: absent

- name: Recriar diretório de dados
  ansible.builtin.file:
    path: "{{ vaultwarden_dir }}/vw-data"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Restaurar dados do Vaultwarden
  ansible.builtin.command:
    argv:
      - cp
      - -a
      - "{{ vaultwarden_restore_work_dir }}/extracted/{{ vaultwarden_restore_data_archive_path }}/."
      - "{{ vaultwarden_dir }}/vw-data/"
  changed_when: true

- name: Subir Vaultwarden restaurado
  community.docker.docker_compose_v2:
    project_src: "{{ vaultwarden_dir }}"
    state: present
    pull: never

- name: Remover arquivos temporários do restore
  ansible.builtin.file:
    path: "{{ vaultwarden_restore_work_dir }}"
    state: absent
---
vaultwarden_restore_confirmation: ""
vaultwarden_restore_work_dir: "/var/tmp/vaultwarden-restore"

# Caminho do vw-data dentro do archive (o Borg tira a barra inicial). O
# padrão é o do LXC; o archive do Pi tem mnt/secure/appdata/vaultwarden/vw-data
# (docs/vaultwarden-restore.md, volta da contingência).
vaultwarden_restore_data_archive_path: "opt/vaultwarden/vw-data"

# Hostname da máquina cujos backups valem para o restore (o LXC de produção). Archives
# vaultwarden-* de outras máquinas são ignorados.
vaultwarden_restore_source_host: vaultwarden

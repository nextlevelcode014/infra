---
# Usuário fora do grupo docker de propósito: estar nele equivale a root sem
# senha. Na VPS, docker roda com sudo.
- name: Instalar Docker
  ansible.builtin.include_role:
    name: geerlingguy.docker
  vars:
    docker_users: []

# 0755: o container roda como não-root e lê a política montada daqui.
- name: Preparar o diretório da stack
  ansible.builtin.include_role:
    name: compose_stack
    tasks_from: dir
  vars:
    compose_stack_dir: "{{ anubis_dir }}"
    compose_stack_mode: "0755"

# 0644: o container roda como não-root e precisa ler a política.
- name: Renderizar a política de cada instância
  ansible.builtin.template:
    src: policy.yaml.j2
    dest: "{{ anubis_dir }}/policy-{{ item.name }}.yaml"
    mode: "0644"
  vars:
    anubis_policy: "{{ item.policy | default({}) }}"
  loop: "{{ anubis_instances }}"
  loop_control:
    label: "{{ item.name }}"
  register: anubis_policy_results

- name: Subir o Anubis
  ansible.builtin.include_role:
    name: compose_stack
  vars:
    compose_stack_dir: "{{ anubis_dir }}"

# A política é lida só na partida, e mudar o arquivo montado não recria o
# container: reinicia quem teve a política alterada.
- name: Reiniciar as instâncias com política nova
  community.docker.docker_compose_v2:
    project_src: "{{ anubis_dir }}"
    files: [compose.yml]
    state: restarted
    services: "{{ anubis_policy_results.results | selectattr('changed') | map(attribute='item.name') | map('regex_replace', '^', 'anubis-') | list }}"
  when:
    - not ansible_check_mode
    - anubis_policy_results.results | selectattr('changed') | list | length > 0
